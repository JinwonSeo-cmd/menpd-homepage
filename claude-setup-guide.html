<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클로드 혼자 세팅하기</title>
<meta name="description" content="클로드 데스크톱 앱 설치, 내 폴더 연결, 클로드인크롬, 제미나이·구글 플로우·일레븐랩스 연결까지 한 단계씩 따라 하는 왕초보 동적교재">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#f4f1e9; --card:#fffdf8; --ink:#17160f; --ink-soft:#57544a; --line:#d8d2c2;
  --accent:#1f5a8c; --accent-soft:#dde9f3; --ok:#2f7a4a; --ok-soft:#dcefe2;
  --warn:#a5561c; --warn-soft:#f8e6d6; --hl:#e0362b; --mock:#ffffff; --mock-2:#eef0f3; --mock-ink:#22252b;
  --fs:20px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15140f; --card:#1f1d17; --ink:#f0ede3; --ink-soft:#b3ad9c; --line:#3d3a2f;
    --accent:#7db3e0; --accent-soft:#1f3142; --ok:#7fcb98; --ok-soft:#1d3326;
    --warn:#eaa36b; --warn-soft:#3b2a1b; --hl:#ff5a4f; --mock:#2a2c31; --mock-2:#202227; --mock-ink:#e7e8ea; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15140f; --card:#1f1d17; --ink:#f0ede3; --ink-soft:#b3ad9c; --line:#3d3a2f;
  --accent:#7db3e0; --accent-soft:#1f3142; --ok:#7fcb98; --ok-soft:#1d3326;
  --warn:#eaa36b; --warn-soft:#3b2a1b; --hl:#ff5a4f; --mock:#2a2c31; --mock-2:#202227; --mock-ink:#e7e8ea; color-scheme:dark;
}
:root.big{--fs:24px;}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:.95rem;margin-right:auto;cursor:pointer;background:none;border:0;color:var(--ink);padding:6px 0}
.tbtn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;font-size:.78rem;font-weight:700;min-height:44px}
.tbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink-soft);padding:6px 12px;font-size:.78rem;font-weight:700;min-height:40px}
.seg button.on{background:var(--accent);color:#fff}
.bar{height:8px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
main{max-width:880px;margin:0 auto;padding:22px 16px 120px}
h1{font-size:1.75rem;line-height:1.3;margin:.4em 0 .3em;letter-spacing:-.02em}
h2{font-size:1.4rem;line-height:1.35;margin:.2em 0 .5em;letter-spacing:-.01em}
.lead{color:var(--ink-soft);font-size:1rem;margin:0 0 1em}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;margin:16px 0}
.parts{display:grid;gap:12px}
.part{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:left;color:var(--ink);width:100%}
.part:hover{border-color:var(--accent)}
.part .num{flex:0 0 52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.1rem;background:var(--accent-soft);color:var(--accent)}
.part.done .num{background:var(--ok);color:#fff}
.part b{display:block;font-size:1.05rem}
.part small{color:var(--ink-soft);font-size:.8rem}
.part .pct{margin-left:auto;font-weight:800;color:var(--ok);font-size:.85rem;white-space:nowrap}
.big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:12px 26px;border-radius:16px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:1.05rem;text-decoration:none}
.big-btn.ok{background:var(--ok)}
.big-btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.os-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.os-pick button{min-height:110px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1.05rem}
.os-pick button span{display:block;font-size:2rem}
.os-pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border:0}
.check input{width:30px;height:30px;flex:0 0 30px;margin-top:2px;accent-color:var(--ok)}
.check label{cursor:pointer}
.check small{display:block;color:var(--ink-soft);font-size:.82rem}
/* step */
.stephead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 14px;font-size:.75rem;font-weight:800}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--ok)} .dots i.c{background:var(--accent);outline:3px solid var(--accent-soft)}
ol.do{padding:0;margin:14px 0;list-style:none;counter-reset:s}
ol.do li{counter-increment:s;position:relative;padding:10px 0 10px 56px;border-bottom:1px dashed var(--line);font-size:1.02rem}
ol.do li:last-child{border:0}
ol.do li::before{content:counter(s);position:absolute;left:0;top:8px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:900}
ol.do b{color:var(--hl)}
.key{display:inline-block;border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:0 8px;font-size:.85em;font-weight:800;background:var(--card)}
.tip{background:var(--ok-soft);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:.95rem}
.tip::before{content:"💡 도움말";display:block;font-weight:800;color:var(--ok);font-size:.8rem}
.warn{background:var(--warn-soft);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:.95rem}
.warn::before{content:"⚠️ 꼭 지켜주세요";display:block;font-weight:800;color:var(--warn);font-size:.8rem}
.copybox{border:2px dashed var(--accent);border-radius:16px;padding:14px 16px;margin:12px 0;background:var(--accent-soft)}
.copybox p{margin:0 0 10px;font-weight:600}
.copybox button{min-height:52px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:800;padding:8px 18px}
.copybox button.done{background:var(--ok)}
.linkbtn{margin:8px 0 4px}
details.stuck{border:2px solid var(--warn);border-radius:16px;margin:14px 0;background:var(--card)}
details.stuck summary{list-style:none;padding:14px 16px;font-weight:800;color:var(--warn);cursor:pointer;min-height:56px}
details.stuck summary::-webkit-details-marker{display:none}
details.stuck div{padding:0 16px 14px}
details.stuck dt{font-weight:800;margin-top:10px}
details.stuck dd{margin:2px 0 0;color:var(--ink-soft)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--line);z-index:20}
.nav-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:10px}
.nav .big-btn{flex:1}
.nav .big-btn.ghost{flex:0 0 auto}
/* mock screens */
.shot{margin:14px 0 4px}
.shot img{width:100%;border-radius:14px;border:2px solid var(--line);display:block}
.shot figcaption{font-size:.72rem;color:var(--ink-soft);margin-top:6px;text-align:center}
.mock{border-radius:14px;border:2px solid var(--line);overflow:hidden;background:var(--mock);color:var(--mock-ink);font-size:15px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.m-top{display:flex;align-items:center;gap:8px;background:var(--mock-2);padding:8px 10px;border-bottom:1px solid rgba(127,127,127,.25)}
.m-dots{display:flex;gap:5px}.m-dots i{width:10px;height:10px;border-radius:50%;background:#c9ccd2}
.m-url{flex:1;background:var(--mock);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mock-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-title{flex:1;font-weight:700;font-size:13px}
.m-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex:0 0 30px}
.m-main{display:flex;min-height:180px}
.m-body{flex:1;padding:22px 16px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.m-side{flex:0 0 42%;border-left:1px solid rgba(127,127,127,.25);background:var(--mock-2);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.m-h{font-weight:800;font-size:19px}
.m-p{opacity:.75;font-size:14px}
.m-btn{border-radius:10px;padding:9px 16px;font-weight:700;background:#22252b;color:#fff;font-size:14px;display:inline-block}
.m-btn.l{background:transparent;color:var(--mock-ink);border:1.5px solid rgba(127,127,127,.5)}
.m-menu{border:1px solid rgba(127,127,127,.35);border-radius:10px;background:var(--mock);box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:200px}
.m-menu div.hl{outline-offset:-3px;background:rgba(224,54,43,.08)}
.m-menu div{padding:9px 14px;border-bottom:1px solid rgba(127,127,127,.15)}
.m-grid{display:flex;flex-wrap:wrap;gap:14px}
.m-file{width:86px;text-align:center;font-size:13px;padding:6px;border-radius:10px}
.m-file span{display:block;font-size:34px;line-height:1.2}
.m-chat{align-self:stretch;display:flex;flex-direction:column;gap:6px}
.m-msg{border-radius:12px;padding:8px 12px;font-size:14px;max-width:88%;background:var(--mock-2)}
.m-msg.me{align-self:flex-end;background:#d8e6f6;color:#17202b}
.m-input{align-self:stretch;display:flex;align-items:center;gap:8px;border:1.5px solid rgba(127,127,127,.45);border-radius:14px;padding:8px 10px;margin-top:auto}
.m-input .ph{flex:1;opacity:.55;font-size:14px}
.m-plus{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(127,127,127,.55);display:grid;place-items:center;font-weight:800}
.m-send{width:30px;height:30px;border-radius:8px;background:#c8642f;color:#fff;display:grid;place-items:center;font-size:14px}
.m-bm{display:flex;gap:6px;padding:6px 10px;background:var(--mock-2);border-bottom:1px solid rgba(127,127,127,.25);font-size:12px;flex-wrap:wrap}
.m-bm span{background:var(--mock);border-radius:6px;padding:2px 8px}
.m-drag{display:flex;align-items:center;gap:18px;font-size:14px}
.m-drag span{font-size:40px}
.hl{position:relative;outline:3px solid var(--hl);outline-offset:3px;border-radius:10px;animation:pulse 1.4s ease-in-out infinite}
.hl::after{content:"👆 여기!";position:absolute;right:-10px;top:-16px;background:var(--hl);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;z-index:2}

.m-top .hl::after{top:auto;bottom:-26px}
@keyframes pulse{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}.bar i{transition:none}}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.gcard .em{font-size:2rem}
.gcard b{font-size:1.02rem}
.gcard p{margin:0;font-size:.85rem;color:var(--ink-soft)}
.gcard button{margin-top:auto;min-height:48px;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font-weight:800}
.gcard button.done{background:var(--ok);border-color:var(--ok);color:#fff}
.flow{display:grid;gap:10px}
.flow .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .node{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:.9rem;text-align:center}
.flow .node small{display:block;font-weight:500;color:var(--ink-soft);font-size:.72rem}
.flow .node.a{border-color:var(--accent);background:var(--accent-soft)}
.flow .arr{font-weight:900;color:var(--accent)}
.cert{text-align:center;border:3px solid var(--ok);background:var(--ok-soft)}
.cert .big{font-size:3rem}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;font-size:.85rem}
.toast.on{opacity:1}
@media (max-width:560px){
  :root{--fs:18px} :root.big{--fs:22px}
  .m-main{flex-direction:column}.m-side{border-left:0;border-top:1px solid rgba(127,127,127,.25)}
  .mock{font-size:13px}
  .top-in{gap:6px}
}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <button class="brand" id="homeBtn" aria-label="처음 화면으로">🏠 클로드 혼자 세팅하기</button>
  <div class="seg" role="group" aria-label="컴퓨터 종류">
    <button data-os="win">🪟 윈도우</button><button data-os="mac">🍎 맥</button>
  </div>
  <button class="tbtn" id="bigBtn" aria-pressed="false">가+ 글자 크게</button>
  <button class="tbtn" id="ttsBtn" aria-pressed="false">🔊 읽어주기</button>
</div><div class="bar"><i id="barFill"></i></div></div>

<main id="app"></main>
<div class="nav" id="nav" hidden><div class="nav-in">
  <button class="big-btn ghost" id="prevBtn">◀ 이전</button>
  <button class="big-btn ok" id="nextBtn">다 했어요 ▶</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
/* ---------- 상태 ---------- */
var KEY='menpd-claude-setup-v1';
var S={os:null,done:{},prep:{},big:false,i:-1};
try{var raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.os){ S.os=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'mac':'win'; }
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function T(x){ if(x==null) return ''; if(typeof x==='object' && !Array.isArray(x) && ('win' in x||'mac' in x)) return x[S.os]; return x; }
var CTRL=function(){return S.os==='mac'?'<span class="key">⌘ command</span>':'<span class="key">Ctrl</span>';};

/* ---------- 화면 그림(모형) ---------- */
function blk(b){
  var h=b.hl?' hl':'';
  if(b.h) return '<div class="m-h'+h+'">'+b.h+'</div>';
  if(b.p) return '<div class="m-p">'+b.p+'</div>';
  if(b.btn) return '<span class="m-btn'+(b.light?' l':'')+h+'">'+T(b.btn)+'</span>';
  if(b.menu) return '<div class="m-menu">'+b.menu.map(function(m,i){return '<div class="'+(b.hl===i+1?'hl':'')+'">'+T(m)+'</div>';}).join('')+'</div>';
  if(b.files) return '<div class="m-grid">'+b.files.map(function(f,i){return '<div class="m-file'+(b.hl===i+1?' hl':'')+'"><span>'+f[0]+'</span>'+f[1]+'</div>';}).join('')+'</div>';
  if(b.chat) return '<div class="m-chat">'+b.chat.map(function(c){return '<div class="m-msg'+(c[0]?' me':'')+'">'+c[1]+'</div>';}).join('')+'</div>';
  if(b.input) return '<div class="m-input"><span class="m-plus'+(b.hlPlus?' hl':'')+'">+</span><span class="ph">'+b.input+'</span><span class="m-send'+(b.hlSend?' hl':'')+'">↑</span></div>';
  if(b.drag) return '<div class="m-drag"><span>'+b.drag[0]+'</span><b>→ 끌어다 놓기 →</b><span class="hl">'+b.drag[1]+'</span></div>';
  if(b.row) return '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+b.row.map(blk).join('')+'</div>';
  return '';
}
function mock(m){
  m=T(m); if(!m) return '';
  var top;
  if(m.f==='browser'){
    top='<div class="m-top"><div class="m-dots"><i></i><i></i><i></i></div><div class="m-url">🔒 '+m.url+'</div>'
      +(m.ext?'<span class="m-ico'+(m.ext==='puzzle'?' hl':'')+'">🧩</span>':'')
      +(m.ext==='claude'||m.ext==='both'||m.ext==='claude0'?'<span class="m-ico'+(m.ext==='claude0'?'':' hl')+'" style="background:#c8642f;color:#fff">✳</span>':'')
      +(m.dl?'<span class="m-ico hl">⬇</span>':'')+'</div>'
      +(m.bm?'<div class="m-bm">'+m.bm.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>':'');
  } else {
    top='<div class="m-top"><div class="m-dots"><i></i><i></i><i></i></div><div class="m-title">'+(m.title||'')+'</div></div>';
  }
  var body='<div class="m-body">'+(m.b||[]).map(blk).join('')+'</div>';
  var side=m.side?'<div class="m-side"><div style="font-weight:800;font-size:13px">✳ Claude</div>'+m.side.map(blk).join('')+'</div>':'';
  return '<div class="mock" aria-hidden="true">'+top+'<div class="m-main">'+body+side+'</div></div>';
}
function shot(st){
  var m=mock(st.mock); if(!m) return '';
  var img='images/setup/'+st.id+'-'+S.os+'.png';
  return '<figure class="shot" data-img="'+img+'">'+m+'<figcaption>그림은 이해를 돕는 예시예요. 실제 화면은 글자·색이 조금 다를 수 있어요.</figcaption></figure>';
}

/* ---------- 내용 ---------- */
var PARTS=[
{id:'A',title:'클로드 앱 설치하기',sub:'컴퓨터에 클로드 프로그램 깔기 · 약 10분',em:'💻',steps:[
 {id:'a1',title:'크롬을 열고 다운로드 페이지로 가기',
  do:['바탕화면이나 아래쪽 줄에서 <b>크롬(동그란 빨강·노랑·초록 아이콘)</b>을 두 번 누릅니다.','아래 <b>파란 버튼</b>을 누르면 다운로드 페이지가 새 창으로 열립니다.'],
  link:['https://claude.ai/download','👉 클로드 다운로드 페이지 열기'],
  mock:{f:'browser',url:'claude.ai/download',b:[{h:'Claude를 내 컴퓨터에'},{p:'Windows · macOS에서 사용할 수 있어요'},{btn:{win:'Windows용 다운로드',mac:'macOS용 다운로드'},hl:1}]},
  stuck:[['크롬이 없어요','아래 주소에서 크롬을 먼저 설치하세요 → google.com/chrome  (설치 후 이 교재로 다시 돌아오세요)'],['버튼을 눌러도 아무 일이 없어요','주소창에 claude.ai/download 를 직접 입력하고 <span class="key">Enter</span>를 누르세요.']]},
 {id:'a2',title:'다운로드 버튼 누르기',
  do:[{win:'<b>Windows용 다운로드</b> 라고 적힌 버튼을 한 번 누릅니다.',mac:'<b>macOS용 다운로드</b> 라고 적힌 버튼을 한 번 누릅니다.'},'오른쪽 위에 <b>⬇ 모양(다운로드 표시)</b>이 생기면 성공입니다. 잠깐 기다리세요.'],
  mock:{f:'browser',url:'claude.ai/download',dl:1,b:[{h:'Claude를 내 컴퓨터에'},{btn:{win:'Windows용 다운로드',mac:'macOS용 다운로드'}},{p:'다운로드가 시작되었습니다…'}]},

}

/* ---------- 이벤트 ---------- */
var toastT;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},1800);}
document.addEventListener('click',function(e){
  var b=e.target.closest('button,[data-part]'); if(!b) return;
  if(b.dataset.os){S.os=b.dataset.os;save();render();toast(S.os==='mac'?'🍎 맥 설명으로 바꿨어요':'🪟 윈도우 설명으로 바꿨어요');return;}
  if(b.dataset.part!=null){var pi=+b.dataset.part;var first=FLAT.findIndex(function(f){return f.pi===pi&&!S.done[f.s.id];});if(first===-1)first=FLAT.findIndex(function(f){return f.pi===pi;});go(first);return;}
  if(b.dataset.step!=null){go(+b.dataset.step);return;}
  if(b.dataset.goto==='big'){go('big');return;}
  if(b.dataset.copy!=null){
    var txt=b.dataset.copy, done=function(){b.classList.add('done');b.textContent='✓ 복사됐어요! 붙여넣기 하세요';toast('복사됐어요. '+(S.os==='mac'?'⌘':'Ctrl')+'+V로 붙여넣으세요');};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done();});}else{fallback(txt);done();}
    return;
  }
  if(b.id==='goHome2'){go(-1);}
});
function fallback(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}
document.addEventListener('change',function(e){if(e.target.dataset.prep){S.prep[e.target.dataset.prep]=e.target.checked;save();}});
document.getElementById('homeBtn').onclick=function(){go(-1);};
document.getElementById('bigBtn').onclick=function(){S.big=!S.big;save();render();};
document.getElementById('ttsBtn').onclick=function(){
  if(!('speechSynthesis' in window)){toast('이 브라우저는 읽어주기를 지원하지 않아요');return;}
  tts=!tts;this.setAttribute('aria-pressed',tts?'true':'false');
  if(tts){toast('🔊 각 단계를 소리로 읽어드려요');speak();}else{speechSynthesis.cancel();}
};
document.getElementById('prevBtn').onclick=function(){go(typeof S.i==='number'&&S.i>0?S.i-1:-1);};
document.getElementById('nextBtn').onclick=function(){
  var s=FLAT[S.i].s; var first=!S.done[s.id]; S.done[s.id]=true;
  var p=FLAT[S.i].p, partDone=p.steps.every(function(x){return S.done[x.id];});
  if(first&&partDone) toast('🎉 '+p.id+'. '+p.title+' 완료!'); else if(first) toast('👍 잘하셨어요!');
  go(S.i+1<FLAT.length?S.i+1:'big');
};
if(typeof S.i!=='number'&&S.i!=='big') S.i=-1;
render();
})();
</script>
</body>
</html>
