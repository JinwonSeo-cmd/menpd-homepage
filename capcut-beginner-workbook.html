<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캡컷 왕초보 실습 워크북 — 혼자서도 끝까지</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Pretendard');
  }
  :root{
    --void:#12151A;
    --panel:#1B2028;
    --panel-soft:#232A34;
    --panel-line:#2E3644;
    --ink:#EDEFF2;
    --ink-soft:#9AA3B2;
    --ink-faint:#5D6675;
    --teal:#2BB3A3;
    --teal-soft:#173A38;
    --coral:#FF7A59;
    --coral-soft:#3A241D;
    --green:#59D499;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  a{color:inherit;}

  /* ---------- Shell layout ---------- */
  .shell{
    display:flex;
    min-height:100vh;
    max-width:1280px;
    margin:0 auto;
  }
  .rail{
    width:280px;
    flex-shrink:0;
    padding:28px 18px 28px 24px;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-y:auto;
    border-right:1px solid var(--panel-line);
  }
  .rail::-webkit-scrollbar{width:6px;}
  .rail::-webkit-scrollbar-thumb{background:var(--panel-line);border-radius:3px;}

  .brand{
    margin-bottom:22px;
  }
  .brand .kicker{
    font-size:12.5px;
    color:var(--teal);
    font-weight:600;
    letter-spacing:0.02em;
  }
  .brand h1{
    font-size:19px;
    font-weight:800;
    margin:6px 0 0;
    line-height:1.35;
  }

  .progress-wrap{
    margin-bottom:22px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .progress-track{
    height:6px;
    background:var(--panel-soft);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--green));
    border-radius:99px;
    width:0%;
    transition:width .5s ease;
  }

  .steps{
    list-style:none;
    margin:0;
    padding:0;
  }
  .step{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 8px;
    border-radius:10px;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:13.5px;
    transition:background .15s ease, color .15s ease;
  }
  .step:hover{background:var(--panel);}
  .step.active{background:var(--panel-soft);color:var(--ink);}
  .step .dot{
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:50%;
    border:1.5px solid var(--panel-line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    font-weight:700;
    color:var(--ink-faint);
    margin-top:1px;
  }
  .step.active .dot{border-color:var(--teal);color:var(--teal);}
  .step.done .dot{background:var(--green);border-color:var(--green);color:#0C1F16;}
  .step .stitle{padding-top:2px;}
  .step .part-label{
    font-size:10.5px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin:16px 0 4px 8px;
  }

  /* ---------- Stage ---------- */
  .stage{
    flex:1;
    min-width:0;
    padding:34px 44px 80px;
  }
  .stage-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:6px;
  }
  .tag{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:99px;
  }
  .tag.learn{background:var(--teal-soft);color:var(--teal);}
  .tag.practice{background:var(--coral-soft);color:var(--coral);}
  .chnum{
    font-variant-numeric:tabular-nums;
    color:var(--ink-faint);
    font-size:13px;
    font-weight:600;
  }
  h2.chtitle{
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:10px 0 22px;
    max-width:640px;
  }
  .lede{
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:620px;
    margin-bottom:26px;
  }

  .shot-frame{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:14px;
    margin-bottom:26px;
    max-width:760px;
  }
  .shot-frame .cap{
    font-size:12.5px;
    color:var(--ink-faint);
    margin-top:10px;
    padding-left:2px;
  }
  .shot-wrap{
    position:relative;
    border-radius:8px;
    overflow:hidden;
    line-height:0;
  }
  .shot-wrap img{
    width:100%;
    display:block;
  }
  .pin{
    position:absolute;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--coral);
    color:#231108;
    font-weight:800;
    font-size:12.5px;
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 4px rgba(255,122,89,0.22);
  }
  .pin-list{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .pin-list .pl-item{
    display:flex;
    gap:9px;
    align-items:baseline;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .pin-list .pl-num{
    flex-shrink:0;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--coral-soft);
    color:var(--coral);
    font-size:11px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }

  .body-block{max-width:640px;margin-bottom:22px;}
  .body-block h3{
    font-size:16px;
    font-weight:700;
    margin:0 0 10px;
  }
  .body-block p{
    font-size:14.5px;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .body-block ul{
    margin:0;
    padding-left:0;
    list-style:none;
  }
  .body-block ul li{
    position:relative;
    padding-left:18px;
    font-size:14.5px;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .body-block ul li::before{
    content:'';
    position:absolute;
    left:0;top:9px;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--teal);
  }

  .key-table{
    width:100%;
    max-width:640px;
    border-collapse:collapse;
    margin-bottom:22px;
    font-size:14px;
  }
  .key-table th{
    text-align:left;
    color:var(--ink-faint);
    font-weight:600;
    font-size:12px;
    padding:0 10px 8px 0;
    border-bottom:1px solid var(--panel-line);
  }
  .key-table td{
    padding:9px 10px 9px 0;
    border-bottom:1px solid var(--panel-line);
    color:var(--ink-soft);
  }
  .key-table td.kcombo{
    color:var(--ink);
    font-weight:600;
    white-space:nowrap;
  }
  kbd{
    background:var(--panel-soft);
    border:1px solid var(--panel-line);
    border-bottom-width:2px;
    padding:2px 7px;
    border-radius:6px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--ink);
  }

  .diagram-card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:22px 24px;
    max-width:640px;
    margin-bottom:24px;
  }
  .diagram-card .dcap{
    font-size:12.5px;
    color:var(--ink-faint);
    margin-top:12px;
  }

  .skill-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    max-width:640px;
    margin-bottom:24px;
  }
  .skill-card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:16px 14px;
  }
  .skill-card .sic{font-size:20px;margin-bottom:8px;display:block;}
  .skill-card .stt{font-size:13.5px;font-weight:700;margin-bottom:3px;}
  .skill-card .sdd{font-size:12px;color:var(--ink-faint);line-height:1.5;}

  .practice-box{
    background:var(--coral-soft);
    border:1px solid #56342A;
    border-radius:14px;
    padding:20px 22px;
    max-width:640px;
    margin-top:8px;
  }
  .practice-box .ptitle{
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:800;color:var(--coral);
    margin-bottom:12px;
  }
  .practice-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .practice-item:last-child{border-bottom:none;}
  .practice-item .chk{
    flex-shrink:0;
    width:19px;height:19px;
    border-radius:6px;
    border:1.5px solid #7A5142;
    margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    color:transparent;
    transition:all .15s ease;
  }
  .practice-item.checked .chk{
    background:var(--green);
    border-color:var(--green);
    color:#0C1F16;
  }
  .practice-item .ptext{
    font-size:14px;
    color:var(--ink);
  }
  .practice-item.checked .ptext{
    color:var(--ink-faint);
    text-decoration:line-through;
  }

  .callout-note{
    max-width:640px;
    background:var(--teal-soft);
    border-left:3px solid var(--teal);
    border-radius:8px;
    padding:12px 16px;
    font-size:13.5px;
    color:#B9E8E2;
    margin-bottom:24px;
  }

  .final-grid{
    max-width:680px;
    display:flex;
    flex-direction:column;
    gap:0;
    margin-bottom:8px;
  }
  .phase-row{
    display:flex;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--panel-line);
  }
  .phase-row .pnum{
    flex-shrink:0;
    width:30px;height:30px;
    border-radius:50%;
    background:var(--panel-soft);
    color:var(--teal);
    font-weight:800;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .phase-row .ptit{font-size:14.5px;font-weight:700;margin-bottom:2px;}
  .phase-row .pdesc{font-size:13px;color:var(--ink-faint);}

  .nav-bottom{
    display:flex;
    justify-content:space-between;
    max-width:760px;
    margin-top:38px;
    padding-top:22px;
    border-top:1px solid var(--panel-line);
  }
  .nbtn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--ink);
    padding:11px 18px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .nbtn:hover{border-color:var(--teal);}
  .nbtn.primary{
    background:var(--teal);
    border-color:var(--teal);
    color:#08201D;
  }
  .nbtn:disabled{opacity:0.3;cursor:default;}
  .nbtn:disabled:hover{border-color:var(--panel-line);}

  @media (max-width:880px){
    .shell{flex-direction:column;}
    .rail{
      width:100%;
      height:auto;
      position:relative;
      border-right:none;
      border-bottom:1px solid var(--panel-line);
      padding:20px 18px;
    }
    .steps{display:flex;overflow-x:auto;gap:4px;padding-bottom:6px;}
    .step{flex-shrink:0;}
    .part-label{display:none;}
    .stage{padding:26px 20px 60px;}
    .skill-grid{grid-template-columns:repeat(2,1fr);}
    h2.chtitle{font-size:24px;}
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="rail">
    <div class="brand">
      <div class="kicker">캡컷 왕초보 워크북</div>
      <h1>혼자서도 끝까지<br>편집을 완성하는 법</h1>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>진행률</span><span id="progress-text">0 / 0</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <ul class="steps" id="steps"></ul>
  </nav>

  <main class="stage" id="stage"></main>
</div>

      <text x="248" y="60" fill="#08201D" font-size="11" font-weight="700">전환 0.3~0.5초</text>
    </svg>
    <div class="dcap">두 클립의 경계를 더블클릭하면 전환 효과 목록이 열려요. 지속 시간을 짧게 잡을수록 자연스럽습니다.</div>
  </div>`;
}
function keyframeDiagram(){
  return `
  <div class="diagram-card">
    <svg viewBox="0 0 560 140" width="100%" height="140">
      <line x1="30" y1="100" x2="530" y2="100" stroke="#2E3644" stroke-width="1"/>
      <path d="M30 100 Q 280 20 530 40" fill="none" stroke="#2BB3A3" stroke-width="2"/>
      <rect x="22" y="92" width="16" height="16" fill="#2BB3A3" transform="rotate(45 30 100)"/>
      <text x="14" y="122" fill="#9AA3B2" font-size="11">Point A (시작)</text>
      <rect x="522" y="32" width="16" height="16" fill="#FF7A59" transform="rotate(45 530 40)"/>
      <text x="440" y="26" fill="#9AA3B2" font-size="11">Point B (도착)</text>
    </svg>
    <div class="dcap">마름모 두 개(A, B)가 각각 다른 크기·위치를 저장하면, 그 사이는 자동으로 부드럽게 이어져 움직임이 됩니다.</div>
  </div>`;
}

/* ====================== STATE ====================== */
let current = 0;
const checks = chapters.map(ch => (ch.practice||[]).map(()=>false));

function totalItems(){ return chapters.reduce((s,c)=>s+((c.practice||[]).length),0); }
function doneItems(){ return checks.reduce((s,arr)=>s+arr.filter(Boolean).length,0); }
function chapterDone(i){
  const arr = checks[i];
  return arr.length>0 && arr.every(Boolean);
}

function renderRail(){
  const ul = document.getElementById('steps');
  ul.innerHTML = '';
  let lastPart = null;
  chapters.forEach((ch,i)=>{
    if(ch.part !== lastPart){
      const pl = document.createElement('div');
      pl.className='part-label';
      pl.textContent = ch.part;
      ul.appendChild(pl);
      lastPart = ch.part;
    }
    const li = document.createElement('li');
    li.className = 'step' + (i===current?' active':'') + (chapterDone(i)?' done':'');
    li.innerHTML = `<span class="dot">${chapterDone(i)?'✓':(i)}</span><span class="stitle">${ch.title}</span>`;
    li.onclick = ()=>{ current=i; render(); };
    ul.appendChild(li);
  });
  document.getElementById('progress-text').textContent = `${doneItems()} / ${totalItems()}`;
  const pct = totalItems()? Math.round(100*doneItems()/totalItems()) : 0;
  document.getElementById('progress-fill').style.width = pct+'%';
}

function imgSrc(name){
  return {IMG1,IMG2,IMG3,IMG4,IMG5,IMG6}[name];
}

function renderStage(){
  const ch = chapters[current];
  const stage = document.getElementById('stage');
  let html = '';

  html += `<div class="stage-head">
    <span class="tag ${ch.tag}">${ch.tag==='learn'?'배우기':'직접 실습'}</span>
    <span class="chnum">Chapter ${current}</span>
  </div>`;
  html += `<h2 class="chtitle">${ch.title}</h2>`;
  html += `<p class="lede">${ch.lede}</p>`;

  if(ch.shot){
    html += `<div class="shot-frame">
      <div class="shot-wrap" style="padding-bottom:${ch.shot.ratio}%;position:relative;height:0;">
        <img src="${imgSrc(ch.shot.src)}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;">
        ${ch.shot.pins.map(p=>`<div class="pin" style="left:${p.x}%;top:${p.y}%;">${p.n}</div>`).join('')}
      </div>
      ${ch.shot.pins.length? `<div class="pin-list">${ch.shot.pins.map(p=>`<div class="pl-item"><span class="pl-num">${p.n}</span><span>${p.label}</span></div>`).join('')}</div>` : ''}
      <div class="cap">실제 캡컷 PC 편집 화면 캡처</div>
    </div>`;
  }

  if(ch.body) html += ch.body;

  if(ch.keyTable){
    html += `<table class="key-table"><thead><tr><th>동작</th><th>단축키</th><th>설명</th></tr></thead><tbody>
      ${ch.keyTable.map(r=>`<tr><td>${r[0]}</td><td class="kcombo">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
    </tbody></table>`;
  }

  if(ch.diagram==='speed') html += speedDiagram();
  if(ch.diagram==='transition') html += transitionDiagram();
  if(ch.diagram==='keyframe') html += keyframeDiagram();

  if(ch.skills){
    html += `<div class="skill-grid">${ch.skills.map(s=>`
      <div class="skill-card"><span class="sic">${s[0]}</span><div class="stt">${s[1]}</div><div class="sdd">${s[2]}</div></div>
    `).join('')}</div>`;
  }

  if(ch.finalPhases){
    html += `<div class="final-grid">${ch.finalPhases.map((p,idx)=>`
      <div class="phase-row"><div class="pnum">${idx+1}</div><div><div class="ptit">${p[0]}</div><div class="pdesc">${p[1]}</div></div></div>
    `).join('')}</div>`;
  }

  if(ch.practice && ch.practice.length){
    html += `<div class="practice-box">
      <div class="ptitle">🎬 지금 캡컷을 켜고 직접 해보세요</div>
      ${ch.practice.map((p,idx)=>`
        <div class="practice-item ${checks[current][idx]?'checked':''}" data-idx="${idx}">
          <span class="chk">✓</span><span class="ptext">${p}</span>
        </div>
      `).join('')}
    </div>`;
  }

  html += `<div class="nav-bottom">
    <button class="nbtn" id="prevBtn" ${current===0?'disabled':''}>← 이전</button>
    <button class="nbtn primary" id="nextBtn" ${current===chapters.length-1?'disabled':''}>다음 →</button>
  </div>`;

  stage.innerHTML = html;

  stage.querySelectorAll('.practice-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.getAttribute('data-idx'));
      checks[current][idx] = !checks[current][idx];
      render();
    });
  });
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(prevBtn) prevBtn.onclick = ()=>{ if(current>0){current--;render();window.scrollTo(0,0);} };
  if(nextBtn) nextBtn.onclick = ()=>{ if(current<chapters.length-1){current++;render();window.scrollTo(0,0);} };
}

function render(){
  renderRail();
  renderStage();
}
render();
</script>
</body>
</html>
