<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>샘플 · 숫자 강조형 카드뉴스</title><style>@font-face{font-family:P;font-weight:400;src:url(../week1/kit/fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:P;font-weight:600;src:url(../week1/kit/fonts/Pretendard-SemiBold.woff2) format('woff2')}
@font-face{font-family:P;font-weight:800;src:url(../week1/kit/fonts/Pretendard-ExtraBold.woff2) format('woff2')}
:root{--teal:#2C5F6F;--teal2:#3d7d8f;--cream:#FBF6EE;--coral:#E07A52;--ink:#1d2a30;--muted:#5f6f75;--line:#e5ddd0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1d22;overflow:hidden}
body{font-family:P,'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#vp{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:calc(50% - 18px);transform-origin:center center;overflow:hidden;background:var(--cream);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.s{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s,transform .45s}
.s.on{opacity:1;visibility:visible}
.a{opacity:0}
.s.play .a{animation:var(--an,up) .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes left{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
.hl{background:linear-gradient(transparent 62%,rgba(224,122,82,.45) 62%) no-repeat 0 0/0% 100%}
.s.play .hl{animation:hl .8s ease forwards;animation-delay:var(--hd,1s)}
@keyframes hl{to{background-size:100% 100%}}
.draw path,.draw line{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600)}
.s.play .draw path,.s.play .draw line{animation:draw .8s ease forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#cfe0e4;font:600 13px P,sans-serif;opacity:.75;white-space:nowrap}
#stage{width:1080px;height:1350px}
.s{padding:110px 96px 170px;display:flex;flex-direction:column;justify-content:center}
.dark .hl{background-image:linear-gradient(transparent 62%,rgba(255,201,179,.4) 62%)}
.brand{position:absolute;left:96px;bottom:70px;font-size:28px;font-weight:800;color:var(--teal);letter-spacing:.02em}
.num{position:absolute;right:96px;bottom:70px;font-size:28px;font-weight:600;color:var(--muted)}
.prog{position:absolute;left:0;top:0;height:12px;background:var(--coral);width:0}
.s.play .prog{animation:prog var(--dur,3.6s) linear forwards}
@keyframes prog{to{width:100%}}
.k{font-size:34px;font-weight:800;color:var(--coral);letter-spacing:.04em}
.t{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1.16;margin-top:26px}
.sub{font-size:40px;color:var(--muted);line-height:1.5;margin-top:34px}
.dark{background:var(--teal);color:#fff}.dark .sub{color:#cfe3e8}.dark .brand{color:#fff}.dark .num{color:#cfe3e8}
.big{font-size:300px;font-weight:800;letter-spacing:-.06em;line-height:1;color:var(--teal);margin-top:60px}
.big small{font-size:110px;margin-left:10px}
.dark .big{color:#fff}
.vs{display:flex;align-items:baseline;gap:30px;margin-top:70px}
.vs .old{font-size:150px;font-weight:800;color:#b9b2a5;text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:12px}
.vs .ar{font-size:90px;color:var(--coral);font-weight:800}
</style></head><body>
<div id="vp"><div id="stage">
<section class="s dark" style="justify-content:center"><span class="k a">숫자로 보는 AI 업무</span><div class="t a" style="--d:.15s">보고서 한 건,<br>아직도 <span class="hl" style="--hd:.8s">2시간</span><br>걸리세요?</div><div class="sub a" style="--d:.4s">예시로 계산해 봤습니다 →</div><div class="prog"></div><div class="brand">AI작업 · SBA</div><div class="num">1 / 4</div></section>
<section class="s"><span class="k a">작성 시간</span><div class="vs"><span class="old a" style="--d:.2s">120분</span><span class="ar a" style="--d:.5s;--an:pop">→</span></div><div class="big a" style="--d:.7s;--an:pop"><span data-count="30" data-from="120" data-delay=".7">120</span><small>분</small></div><div class="sub a" style="--d:1s">목차·샘플·규칙을 주고 시키면</div><div class="prog"></div><div class="brand">AI작업 · SBA</div><div class="num">2 / 4</div></section>
<section class="s"><span class="k a">수정 횟수</span><div class="big a" style="--d:.2s;--an:pop"><span data-count="1" data-from="5" data-delay=".3">5</span><small>회</small></div><div class="sub a" style="--d:.6s">“3번 장만 고쳐줘”처럼<br><b>장 번호로 콕</b> 집으면 끝</div><div class="prog"></div><div class="brand">AI작업 · SBA</div><div class="num">3 / 4</div></section>
<section class="s dark" style="justify-content:center"><span class="k a" style="color:#FFC9B3">정리</span><div class="t a" style="--d:.15s">시간은 <span data-count="75" data-delay=".4">0</span>% 줄고<br>품질은 일정하게</div><div class="sub a" style="--d:.5s">※ 수치는 실습용 예시입니다</div><div class="prog"></div><div class="brand">AI작업 · SBA</div><div class="num">4 / 4</div></section></div></div><div class="hint">자동으로 넘어갑니다 · 클릭하면 다음 장</div>
<script>window.HINT=1</script><script>
function fit(){var st=document.getElementById('stage'),W=st.offsetWidth,H=st.offsetHeight,k=Math.min(innerWidth/W,(innerHeight-(window.HINT?40:0))/H)*.96;st.style.transform='translate(-50%,-50%) scale('+k+')';}
addEventListener('resize',fit);fit();
function count(sl){sl.querySelectorAll('[data-count]').forEach(function(e){var to=+e.dataset.count,from=+(e.dataset.from||0),t0=null,dur=1200,dl=(parseFloat(e.dataset.delay)||0)*1000;e.textContent=from;setTimeout(function(){requestAnimationFrame(function f(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/dur);p=1-Math.pow(1-p,3);e.textContent=Math.round(from+(to-from)*p).toLocaleString();if(p<1)requestAnimationFrame(f)})},dl)})}
function show(list,i){list.forEach(function(s,j){s.classList.toggle('on',j===i);s.classList.remove('play')});void list[i].offsetWidth;list[i].classList.add('play');count(list[i])}
</script><script>var L=[].slice.call(document.querySelectorAll('.s')),i=0,T;function go(n){i=(n+L.length)%L.length;show(L,i);clearTimeout(T);T=setTimeout(function(){go(i+1)},3600)}
document.getElementById('stage').addEventListener('click',function(){go(i+1)});go(0);</script></body></html>
