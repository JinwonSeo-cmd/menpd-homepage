<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>김법무의 칼퇴 대작전 · 법무부 복습 게임</title>
<style>
@font-face{font-family:'DungGeunMo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');font-display:swap}
:root{--k:#1b1b2f;--navy:#1F3A5F;--teal:#2D6B7A;--cream:#fff4d6;--paper:#fffaf0;--red:#d64535;--green:#2f9e62;--yellow:#f2c14e;--sky:#9ec5ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'DungGeunMo',ui-monospace,Consolas,'Malgun Gothic',monospace;-webkit-font-smoothing:none}
body{background:#16162a;background-image:radial-gradient(#2a2a48 1px,transparent 1px);background-size:8px 8px;color:var(--k);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
img{image-rendering:pixelated;image-rendering:crisp-edges}
.px{border:4px solid var(--k);box-shadow:4px 4px 0 var(--k)}
.game{width:100%;max-width:1280px;background:var(--paper);border:6px solid var(--k);box-shadow:8px 8px 0 #000;position:relative}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 14px;border-bottom:6px solid var(--k)}
.hud h1{font-size:20px;flex:1;min-width:200px;letter-spacing:0;font-weight:400;text-shadow:3px 3px 0 var(--k)}.hud h1 small{font-size:13px;color:var(--yellow);margin-left:8px}
.chip{background:var(--k);border:3px solid #fff;padding:4px 10px;font-size:13px;display:flex;flex-direction:column;align-items:center;min-width:92px;color:#cfd8ff}
.chip b{font-size:22px;font-weight:400;color:#fff;letter-spacing:1px}
.chip.leave b{color:#7dff9a}.chip.leave.late b{color:#ff7b6b;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.bar{height:14px;background:var(--k);border-bottom:6px solid var(--k);display:flex;padding:2px;gap:2px}
.bar i{flex:1;background:#2c2c4a}.bar i.on{background:var(--yellow)}
/* office */
.office{position:relative;aspect-ratio:21/9;overflow:hidden;
 background:
  repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.08) 46px 48px),
  repeating-linear-gradient(0deg,transparent 0 46px,rgba(0,0,0,.08) 46px 48px),
  conic-gradient(#d9c39a 25%,#ccb385 0 50%,#d9c39a 0 75%,#ccb385 0) 0 0/96px 96px}
.wall{position:absolute;left:0;right:0;top:0;height:20%;background:#8fb3c9;border-bottom:8px solid var(--k);
 background-image:repeating-linear-gradient(90deg,#86aac0 0 4px,transparent 4px 32px)}
.wall::after{content:'';position:absolute;left:0;right:0;bottom:0;height:18%;background:#5e7f92}
.win{position:absolute;top:14%;height:58%;width:7%;background:linear-gradient(#bfe6ff 0 50%,#9fd3f7 50%);border:5px solid var(--k);box-shadow:inset 0 0 0 4px #fff}
.win::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;background:#fff;transform:translateX(-50%)}
.sign{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:clamp(11px,1.3vw,16px);padding:4px 14px;border:4px solid var(--k);white-space:nowrap}
.wclock{position:absolute;top:14%;right:16%;width:clamp(30px,3.6vw,52px);aspect-ratio:1;background:#fff;border:5px solid var(--k)}
.wclock i{position:absolute;left:50%;bottom:50%;width:4px;background:var(--k);transform-origin:bottom center}
.wclock .h{height:26%}.wclock .m{height:38%;background:var(--red)}
.deco{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.deco img{display:block;width:100%}
.rug{position:absolute;background:#b9534a;border:5px solid var(--k);box-shadow:inset 0 0 0 6px #d9776d}
.st{position:absolute;width:10%;transform:translate(-50%,-50%);text-align:center}
.st .spr{width:70%;margin:0 auto -4px;display:block;position:relative;z-index:1}
.st .lbl{background:#fff;border:4px solid var(--k);box-shadow:3px 3px 0 var(--k);padding:3px 2px 4px;position:relative}
.st .nm{font-size:clamp(10px,1.15vw,15px);color:var(--navy);white-space:nowrap}
.st .tk{font-size:clamp(9px,.95vw,12px);color:#5a6070;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.now .lbl{background:var(--yellow);animation:hop .5s steps(2) infinite}
.st.ok .lbl{background:#bff2cf}.st.no .lbl{background:#ffc9c2}
@keyframes hop{50%{transform:translateY(-4px)}}
.st .stamp{position:absolute;right:-12%;top:-62%;font-size:clamp(9px,1vw,13px);padding:2px 5px;border:3px solid var(--k);transform:rotate(10deg);display:none;color:#fff}
.st.ok .stamp{display:block;background:var(--green)}.st.no .stamp{display:block;background:var(--red)}
.door{position:absolute;right:2%;top:21%;width:6.5%;height:34%;background:#8a5a32;border:5px solid var(--k);box-shadow:inset 0 0 0 5px #a86b35}
.door::before{content:'EXIT';position:absolute;top:-30%;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:clamp(9px,1vw,13px);padding:2px 6px;border:3px solid var(--k)}
.door i{position:absolute;right:14%;top:50%;width:14%;aspect-ratio:1;background:var(--yellow);border:2px solid var(--k)}
.kim{position:absolute;width:5.4%;transform:translate(-50%,-94%);transition:left 1s steps(10),top 1s steps(10);z-index:5;pointer-events:none}
.kim img{width:100%;display:block;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
.kim.walk img{animation:step .2s steps(2) infinite}
@keyframes step{50%{transform:translateY(-6%)}}
.bubble{position:absolute;left:50%;bottom:104%;transform:translateX(-50%);background:#fff;border:4px solid var(--k);padding:3px 8px;font-size:clamp(10px,1.1vw,14px);white-space:nowrap;display:none}
.bubble::after{content:'';position:absolute;left:50%;top:100%;width:8px;height:8px;background:var(--k);transform:translateX(-50%)}
.bubble.on{display:block}
.float{position:absolute;font-size:clamp(14px,2vw,24px);z-index:9;pointer-events:none;animation:fly 1.4s steps(8) forwards;white-space:nowrap;text-shadow:3px 3px 0 var(--k);color:#fff}
@keyframes fly{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
/* card */
.ov{position:absolute;inset:0;background:rgba(22,22,42,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.on{display:flex}
.card{background:var(--cream);border:6px solid var(--k);box-shadow:8px 8px 0 #000;max-width:720px;width:100%;padding:18px 20px;max-height:100%;overflow:auto}
.ch{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.face{width:72px;height:72px;flex:none;border:4px solid var(--k);background:#fff;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.task{font-size:14px;color:var(--red)}.qtx{font-size:clamp(17px,2vw,22px);line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.opt{font:inherit;font-size:16px;text-align:left;padding:10px 12px;border:4px solid var(--k);background:#fff;cursor:pointer;line-height:1.35;color:var(--k);box-shadow:4px 4px 0 var(--k)}
.opt:hover:not(:disabled){background:#e9f1ff;transform:translate(-1px,-1px)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
.opt:disabled{cursor:default}
.opt.ok{background:#bff2cf}.opt.no{background:#ffc9c2}
.opt::before{content:'▶ ';color:var(--teal)}
.ex{display:none;margin-top:12px;border:4px solid var(--k);padding:10px 12px;font-size:15px;line-height:1.55}
.ex.ok{display:block;background:#bff2cf}.ex.no{display:block;background:#ffc9c2}
.ex b{display:block;font-size:18px;font-weight:400;margin-bottom:2px}
.btn{font:inherit;font-size:17px;border:4px solid var(--k);padding:10px 18px;background:var(--red);color:#fff;cursor:pointer;margin-top:12px;box-shadow:4px 4px 0 var(--k);text-decoration:none;display:inline-block}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
.btn.sec{background:var(--teal)}
.nx{display:none;text-align:right}.nx.on{display:block}
.intro{text-align:center}
.intro .hero{display:flex;justify-content:center;gap:16px;margin:4px 0 10px;align-items:flex-end}
.intro .hero img{height:150px}
.intro h2{font-size:clamp(24px,3.6vw,36px);font-weight:400;color:var(--navy);text-shadow:3px 3px 0 var(--yellow)}
.intro p{font-size:16px;line-height:1.75;margin-top:8px}
.rules{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.rules span{background:#bff2cf;border:3px solid var(--k);padding:5px 10px;font-size:14px}
.rules span.r{background:#ffc9c2}
.press{font-size:14px;margin-top:10px;animation:blink 1s steps(2) infinite}
.res h2{font-size:clamp(26px,4vw,38px)}.res .big{font-size:clamp(44px,7vw,72px);color:var(--navy);text-shadow:4px 4px 0 var(--yellow)}
.res .sub{font-size:17px;margin-top:4px}
.list{text-align:left;margin-top:12px;max-height:170px;overflow:auto;border:4px solid var(--k);background:#fff;padding:8px 12px;font-size:14px;line-height:1.6}
.list .w{color:#8a1f15;margin-bottom:4px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;font-size:13px;background:var(--k);color:#cfd8ff;flex-wrap:wrap;border-top:6px solid var(--k)}
.foot a{color:var(--yellow);text-decoration:none}
.snd{background:none;border:3px solid #cfd8ff;color:#cfd8ff;padding:2px 8px;font:inherit;font-size:13px;cursor:pointer}
@media(max-width:700px){.office{aspect-ratio:16/10}.opts{grid-template-columns:1fr}.chip{min-width:72px;padding:3px 6px}.chip b{font-size:17px}.hud h1{font-size:16px}.intro .hero img{height:110px}.st{width:13%}.kim{width:6.5%}}
</style></head><body>

 <div class="hud">
