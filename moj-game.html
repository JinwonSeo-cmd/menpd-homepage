<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>김법무의 칼퇴 대작전 · 법무부 복습 게임</title>
<style>
:root{--navy:#1F3A5F;--teal:#2D6B7A;--teal-dk:#1A4A56;--coral:#F4A88E;--orange:#E8642C;--cream:#FFF8F0;--mint:#E3EEEC;--ink:#1F2933;--line:#D9E3E4;--red:#d64535;--green:#2f9e62}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:#1b2b33;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.game{width:100%;max-width:980px;background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:12px 16px}
.hud h1{font-size:18px;flex:1;min-width:180px;letter-spacing:-.02em}.hud h1 small{font-size:12px;opacity:.7;font-weight:600;margin-left:6px}
.chip{background:rgba(255,255,255,.12);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;min-width:86px}
.chip b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip.leave b{color:#9fe3b9}.chip.leave.late b{color:#ffb4a8}
.chip.clock{background:#fff;color:var(--navy)}
.bar{height:8px;background:#0f2238}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fd39a,#f6c453);transition:width .6s}
/* office */
.office{position:relative;aspect-ratio:16/9;background:
 linear-gradient(90deg,rgba(45,107,122,.07) 1px,transparent 1px) 0 0/48px 48px,
 linear-gradient(rgba(45,107,122,.07) 1px,transparent 1px) 0 0/48px 48px,#F3EDE2;overflow:hidden}
.wall{position:absolute;left:0;right:0;top:0;height:13%;background:linear-gradient(#cfe0e6,#bcd3db);border-bottom:6px solid #9fbcc6}
.win{position:absolute;top:18%;height:56%;width:9%;background:linear-gradient(#e9f6ff,#bfe0f3);border:3px solid #fff;border-radius:4px}
.sign{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:800;font-size:clamp(10px,1.4vw,14px);padding:3px 12px;border-radius:6px;white-space:nowrap}
.wclock{position:absolute;top:12%;right:3%;width:clamp(30px,5vw,48px);aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.wclock i{position:absolute;left:50%;bottom:50%;width:2px;background:var(--navy);transform-origin:bottom center}
.wclock .h{height:28%}.wclock .m{height:40%;background:var(--orange)}
.st{position:absolute;width:15%;transform:translate(-50%,-50%);text-align:center;transition:transform .3s}
.st .desk{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6% 4% 7%;box-shadow:0 5px 0 #d8cfbf;position:relative}
.st .ic{font-size:clamp(20px,3.6vw,36px);line-height:1.1}
.st .nm{font-size:clamp(9px,1.25vw,13px);font-weight:800;color:var(--teal-dk);margin-top:2px;white-space:nowrap}
.st .tk{font-size:clamp(8px,1.05vw,11.5px);color:#6b7c84;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.now .desk{border-color:var(--orange);box-shadow:0 5px 0 #e8b39a,0 0 0 4px rgba(232,100,44,.25);animation:pulse 1.2s infinite}
.st.ok .desk{background:#eaf8ef;border-color:#8fd3a9}.st.no .desk{background:#fdecea;border-color:#f0a69c}
.st .stamp{position:absolute;right:-8%;top:-14%;font-size:clamp(9px,1.2vw,12px);font-weight:900;padding:2px 6px;border-radius:6px;transform:rotate(12deg);display:none}
.st.ok .stamp{display:block;background:var(--green);color:#fff}.st.no .stamp{display:block;background:var(--red);color:#fff}
.door{position:absolute;right:1.5%;bottom:4%;width:8%;height:30%;background:#8a6a4b;border:4px solid #6e5238;border-radius:8px 8px 0 0}
.door:after{content:'EXIT';position:absolute;top:-22%;left:50%;transform:translateX(-50%);background:#2f9e62;color:#fff;font-size:clamp(8px,1vw,11px);font-weight:900;padding:1px 6px;border-radius:4px}
.door i{position:absolute;right:12%;top:50%;width:12%;aspect-ratio:1;border-radius:50%;background:#f6c453}
@keyframes pulse{50%{transform:translateY(-3px)}}
.kim{position:absolute;width:7.5%;transform:translate(-50%,-92%);transition:left 1s ease-in-out,top 1s ease-in-out;z-index:5;pointer-events:none}
.kim img{width:100%;display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.kim.walk img{animation:bob .25s infinite alternate}
@keyframes bob{to{transform:translateY(-5%) rotate(2deg)}}
.bubble{position:absolute;left:50%;bottom:102%;transform:translateX(-50%);background:#fff;border:2px solid var(--navy);border-radius:12px;padding:4px 9px;font-size:clamp(9px,1.2vw,13px);font-weight:800;white-space:nowrap;display:none}
.bubble.on{display:block}
.float{position:absolute;font-weight:900;font-size:clamp(14px,2.2vw,22px);z-index:9;pointer-events:none;animation:fly 1.4s forwards;white-space:nowrap}
@keyframes fly{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
/* card */
.ov{position:absolute;inset:0;background:rgba(15,34,56,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.card{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:20px 22px;box-shadow:0 18px 40px rgba(0,0,0,.3);animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.face{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;border:3px solid var(--mint);background:#fff}
.face img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.task{font-size:13px;font-weight:800;color:var(--orange)}.qtx{font-size:clamp(16px,2.2vw,20px);font-weight:800;line-height:1.45;letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{font:inherit;font-size:15px;font-weight:700;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;line-height:1.4;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--teal);background:#f3f9f9}
.opt:disabled{cursor:default}
.opt.ok{background:#dff5e8;border-color:#37b26c;color:#17683a}.opt.no{background:#fdecea;border-color:#e4574a;color:#8a1f15}
.ex{display:none;margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.55;font-weight:600}
.ex.ok{display:block;background:#eaf8ef;color:#17683a}.ex.no{display:block;background:#fdecea;color:#8a1f15}
.ex b{display:block;font-size:17px;margin-bottom:2px}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:12px 22px;background:var(--orange);color:#fff;cursor:pointer;margin-top:12px}
.btn.sec{background:var(--teal)}
.nx{display:none;text-align:right}.nx.on{display:block}
.intro{text-align:center}
.intro .hero{display:flex;justify-content:center;gap:10px;margin:4px 0 8px}
.intro .hero img{height:150px}
.intro h2{font-size:clamp(22px,3.4vw,30px);color:var(--navy);letter-spacing:-.02em}
.intro p{font-size:15px;line-height:1.7;color:#3d4a55;margin-top:8px}
.rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.rules span{background:var(--mint);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--teal-dk)}
.rules span.r{background:#fdecea;color:#8a1f15}
.res h2{font-size:clamp(24px,4vw,34px)}.res .big{font-size:clamp(40px,7vw,64px);font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.res .sub{font-weight:800;font-size:16px;margin-top:4px}
.list{text-align:left;margin-top:12px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.6}
.list .w{color:#8a1f15}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-size:12.5px;color:#6b7c84;background:#fff;flex-wrap:wrap}
.foot a{color:var(--teal);font-weight:800;text-decoration:none}
.snd{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer}
@media(max-width:600px){.opts{grid-template-columns:1fr}.chip{min-width:70px;padding:5px 8px}.chip b{font-size:16px}.hud h1{font-size:15px}.intro .hero img{height:110px}}
</style></head><body>
<div class="game" id="game">
 <div class="hud">
  <h1>⏰ 김법무의 칼퇴 대작전<small>법무부 생성형 AI 중급과정 복습</small></h1>
  <div class="chip clock">지금 시각<b id="now">17:00</b></div>
  <div class="chip">처리한 업무<b id="done">0 / 8</b></div>
  <div class="chip leave" id="leaveChip">예상 퇴근<b id="leave">18:00</b></div>
 </div>
 <div class="bar"><i id="bar"></i></div>
 <div class="office" id="office">
  <div class="wall"><div class="win" style="left:6%"></div><div class="win" style="left:17%"></div><div class="sign">법무부 · 홍보기획팀</div><div class="wclock"><i class="h" id="hh"></i><i class="m" id="mh"></i></div></div>
  <div class="door"><i></i></div>
  <div class="kim" id="kim"><div class="bubble" id="bub"></div><img id="kimImg" alt="김법무"></div>
 </div>
 <div class="ov on" id="ov"><div class="card intro" id="introCard">
  <div class="hero"><img id="introImg" alt=""></div>
  <h2>오늘은 꼭 6시 칼퇴!</h2>
  <p>17시, 김법무 책상 위에 <b>업무 8건</b>이 남았습니다.<br>사무실을 돌며 퀴즈를 맞히면 업무가 하나씩 처리돼요.</p>
  <div class="rules"><span>✅ 정답 → 업무 처리 · 칼퇴에 한 걸음</span><span class="r">❌ 오답 → 퇴근 10분 늦어짐</span></div>
  <button class="btn" id="startBtn">업무 시작 ▶</button>
 </div></div>
 <div class="foot"><span>1 · 2 · 3회차 내용에서 무작위로 8문제가 나옵니다. 다시 하면 문제가 바뀌어요.</span><span><button class="snd" id="snd">🔊 소리 켜짐</button> · <a href="moj-prep.html">법무부 준비사항으로 ↩</a></span></div>
</div>
