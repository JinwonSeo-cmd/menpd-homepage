<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 자료 미리보기 | 멘피디 AI</title>
<link rel="stylesheet" href="css/styles.css">
<style>
:root{
  --ink:#203751;--accent:#365f92;--muted:#6a7d91;--paper:#fff;
  --line:rgba(54,95,146,.18);--wash:#edf3f8;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-text,'Pretendard',system-ui,-apple-system,sans-serif);
  color:var(--ink);background:linear-gradient(180deg,#dfeaf5 0,#f2f6f9 380px,#eef2f4 100%);
  -webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px max(20px,calc((100vw - 980px)/2));background:rgba(29,50,76,.94);
  border-bottom:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px)}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:700}
.top span{color:rgba(255,255,255,.72);font-size:12px}
.wrap{width:min(980px,calc(100% - 32px));margin:0 auto;padding:44px 0 90px}
.eyebrow{display:inline-block;margin:0 0 12px;padding:6px 10px;border-radius:999px;
  background:rgba(54,95,146,.09);color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em}
h1{margin:0;color:var(--ink);font-size:clamp(28px,5vw,42px);line-height:1.15;letter-spacing:-.035em}
.help{margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.7}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:24px 0 18px}
.action{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  padding:10px 17px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.82);
  color:var(--accent);font:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer;
  transition:transform .16s ease,background-color .16s ease}
.action:hover{transform:translateY(-2px);background:#fff}
.action.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.action.primary:hover{background:#294a75}
.filename{margin-left:auto;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.panel{display:block;overflow:hidden;border:1px solid rgba(255,255,255,.8);border-radius:22px;
  background:rgba(255,255,255,.78);box-shadow:0 18px 48px rgba(54,83,116,.1);backdrop-filter:blur(14px)}
.panel-head{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:rgba(242,246,249,.8);color:var(--muted);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#9fb3c8}
pre{min-height:360px;margin:0;padding:26px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;
  color:#263f59;font-family:'Pretendard',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.75;
  tab-size:2}
.status{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}
.error{color:#9b332b}
@media (max-width:640px){
  .top span{display:none}.wrap{width:min(100% - 24px,980px);padding-top:30px}
  .toolbar{align-items:stretch}.action{flex:1 1 140px}.filename{width:100%;margin-left:0;text-align:center}
  .panel{border-radius:16px}pre{padding:20px 17px;font-size:13px}
}
</style>
</head>
<body>
<header class="top">
  <a href="seomsanryeon-prep.html#bot-materials">← 실습 봇 자료로 돌아가기</a>
  <span>섬산련 수업용 자료</span>
</header>

<main class="wrap">
  <span class="eyebrow">MATERIAL PREVIEW</span>
  <h1 id="doc-title">자료를 불러오는 중입니다</h1>
  <p class="help">내용을 확인한 뒤 <b>전체 복사하기</b>를 눌러 Claude의 지침 또는 새 대화에 그대로 붙여넣으세요.</p>

  <div class="toolbar">
    <button class="action primary" id="copy-all" type="button" disabled>전체 복사하기</button>
    <a class="action" id="download-link" href="#" download>파일 다운로드 ↓</a>
    <span class="filename" id="doc-file"></span>
  </div>

  <section class="panel" aria-label="자료 원문">
    <div class="panel-head"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>원문 미리보기</span></div>
    <pre id="doc-content" tabindex="0">불러오는 중...</pre>
  </section>
  <p class="status" id="status" role="status" aria-live="polite">자료를 불러오고 있습니다.</p>
</main>

<script>
const documents = {
  guide: {
    title: '수업 자료 다운로드 안내',
    file: 'downloads/seomsanryeon/00-class-download-guide.md'
  },
  'ppt-instructions': {
    title: 'PPT 제작 봇 지침',
    file: 'downloads/seomsanryeon/ppt/ppt-bot-instructions.md'
  },
  'ppt-design': {
    title: 'PPT 디자인 KB',
    file: 'downloads/seomsanryeon/ppt/ppt-design-rules.md'
  },
  'research-free': {
    title: '리서치 봇 — 무료 버전 지침',
    file: 'downloads/seomsanryeon/research-free/research-free-instructions.md'
  },
  'research-paid': {
    title: '리서치 봇 — 유료 버전 지침',
    file: 'downloads/seomsanryeon/research-paid/research-paid-instructions.md'
  },
  'report-free': {
    title: '보고서·기획서 초안 봇 — 무료 실습 프롬프트',
    file: 'downloads/seomsanryeon/report-free/report-free-prompt.md'
  },
  'report-paid': {
    title: '보고서·기획서 초안 봇 — 유료 버전 지침',
    file: 'downloads/seomsanryeon/report-paid/report-paid-instructions.md'
  },
  'report-example': {
    title: '보고서·기획서 예시 초안',
    file: 'downloads/seomsanryeon/report-paid/report-paid-example-draft.md'
  }
};

const params = new URLSearchParams(window.location.search);
const selected = documents[params.get('doc')];
const titleNode = document.getElementById('doc-title');
const fileNode = document.getElementById('doc-file');
const contentNode = document.getElementById('doc-content');
const statusNode = document.getElementById('status');
const copyButton = document.getElementById('copy-all');
const downloadLink = document.getElementById('download-link');
let sourceText = '';

function fallbackCopy(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand('copy');
  area.remove();
  if (!copied) throw new Error('copy failed');
}

async function copyAll() {
  if (!sourceText) return;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(sourceText);
    } else {
      fallbackCopy(sourceText);
    }
    copyButton.textContent = '복사 완료 ✓';
    statusNode.textContent = '전체 내용이 복사되었습니다. Claude에 붙여넣으세요.';
    window.setTimeout(() => { copyButton.textContent = '전체 복사하기'; }, 1800);
  } catch (error) {
    statusNode.textContent = '자동 복사가 되지 않았습니다. 원문을 선택해 직접 복사해 주세요.';
    statusNode.classList.add('error');
  }
}

async function loadDocument() {
  if (!selected) {
    titleNode.textContent = '자료를 찾을 수 없습니다';
    contentNode.textContent = '잘못된 미리보기 주소입니다. 이전 페이지에서 자료를 다시 선택해 주세요.';
    statusNode.textContent = '자료 선택값을 확인해 주세요.';
    statusNode.classList.add('error');
    copyButton.hidden = true;
    downloadLink.hidden = true;
    return;
  }

  titleNode.textContent = selected.title;
  document.title = selected.title + ' | 멘피디 AI';
  fileNode.textContent = selected.file.split('/').pop();
  downloadLink.href = selected.file;

  try {
    const response = await fetch(selected.file, { credentials: 'same-origin' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    sourceText = await response.text();
    contentNode.textContent = sourceText;
    copyButton.disabled = false;
    statusNode.textContent = '원문을 모두 불러왔습니다.';
  } catch (error) {
    contentNode.textContent = '자료를 불러오지 못했습니다. 파일 다운로드 버튼을 이용해 주세요.';
    statusNode.textContent = '미리보기 로딩에 실패했습니다.';
    statusNode.classList.add('error');
    copyButton.hidden = true;
  }
}

copyButton.addEventListener('click', copyAll);
loadDocument();
</script>
</body>
</html>
