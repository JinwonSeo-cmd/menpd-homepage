<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>혼돈의 성 — SBA 3주차 「내 종합봇 짓기」 복습 게임</title>
<meta name="description" content="종합봇(팀장)과 여섯 직원을 구하는 던전 액션 RPG. 수업 내용 퀴즈를 맞혀 장비와 물약을 얻고, 혼돈의 군주를 쓰러뜨리세요.">
<meta name="theme-color" content="#0b0912">
<meta property="og:type" content="website">
<meta property="og:title" content="혼돈의 성 — SBA 3주차 복습 게임">
<meta property="og:description" content="퀴즈를 맞혀 장비와 물약을 얻고, 여섯 직원을 구해 혼돈의 군주 「뒤죽박죽」을 봉인하세요. 직업 3종 · 4개 층 · 약 15~20분.">
<meta property="og:image" content="https://menpd.com/images/sba-week3/game-og.jpg">
<meta property="og:url" content="https://menpd.com/sba-game.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;color:#eee6d8;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  font-family:'Galmuri11','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(13px,1.2vmin + 8px,17px);line-height:1.5;word-break:keep-all}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#world{position:absolute;left:0;top:0;z-index:0;image-rendering:pixelated;image-rendering:crisp-edges}
#fx{position:absolute;left:0;top:0;z-index:1;touch-action:none;cursor:crosshair}
.hidden{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
#hurt{position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 11vmin 3vmin rgba(200,20,20,.6);opacity:0}
#hurt.on{animation:hurt .45s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}
#fade{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1;pointer-events:auto}
/* ── HUD ── */
#hud{position:absolute;inset:0;z-index:3;isolation:isolate;pointer-events:none}
#hud>*{pointer-events:none}
#hud button{pointer-events:auto}
#topL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));text-shadow:0 2px 0 #000,0 0 6px #000;max-width:62vw}
#floorName{color:#f2c14e;font-weight:bold;font-size:1.05em}
#obj{font-size:.8em;color:#cfc6b4;margin-top:1px}
#runeRow{margin-top:5px;display:flex;align-items:center;gap:6px;font-size:.9em;flex-wrap:wrap}
#runeRow .rn{display:inline-flex;align-items:center;gap:4px;background:rgba(10,8,18,.72);border:1px solid #2c6a85;border-radius:99px;padding:1px 9px 1px 6px;color:#9fe8ff}
#runeRow .rn i{width:9px;height:11px;background:#59d8ff;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);display:inline-block}
#staffRow{display:inline-flex;gap:3px}
#staffRow span{width:1.55em;height:1.55em;border-radius:50%;background:rgba(10,8,18,.72);border:1px solid #4a4458;display:inline-flex;align-items:center;justify-content:center;font-size:.8em;filter:grayscale(1) brightness(.55)}
#staffRow span.on{filter:none;border-color:var(--c);box-shadow:0 0 6px var(--c)}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{image-rendering:pixelated;background:rgba(6,5,12,.72);border:1px solid #5b4a2c;border-radius:4px;width:min(34vw,168px);height:auto;display:block}
.tbtns{display:flex;gap:5px}
.tbtns button{width:2.3em;height:2.3em;border-radius:6px;background:rgba(16,12,24,.8);border:1px solid #5b4a2c;font-size:1em;line-height:1}
.tbtns button:active{transform:translateY(1px)}
#bossBar{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:min(52vw,460px);text-align:center;text-shadow:0 2px 0 #000}
#bossName{font-weight:bold;color:#ffb347;font-size:.95em;margin-bottom:3px}
#bossBar .bar{height:.8em;background:#1a0f14;border:2px solid #8a6d3b;border-radius:3px;overflow:hidden}
#bossFill{display:block;height:100%;width:100%;background:linear-gradient(#ff6b5e,#a8201c);transition:width .2s}
#bossVeil{font-size:.75em;color:#c58bff;margin-top:2px;min-height:1em}
#toasts{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(92vw,560px)}
.toast{background:rgba(12,9,20,.9);border:1px solid #5b4a2c;border-radius:8px;padding:6px 14px;font-size:.88em;text-align:center;animation:toast 3.4s forwards;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.toast.gold{border-color:#f2c14e;color:#ffe9a8}.toast.warn{border-color:#c0504a;color:#ffc9c2}.toast.loot{border-color:#8a6d3b}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;animation:banner 3.6s forwards;text-shadow:0 3px 0 #000,0 0 18px #000}
#banner h2{font-size:clamp(1.4em,5vmin,2.4em);color:#f2c14e;letter-spacing:.04em}
#banner p{color:#e6dcc8;margin-top:4px;font-size:1em}
@keyframes banner{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,1.4vw,14px);padding:0 max(6px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(4,3,8,.82) 55%)}
.orb{--s:clamp(54px,13vmin,84px);position:relative;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;border:3px solid #8a6d3b;background:#0e0a12;box-shadow:0 0 0 2px #1a1220,0 4px 12px #000,inset 0 0 12px #000;flex:none}
.orb i{position:absolute;left:0;right:0;bottom:0;height:100%;transition:height .25s}
.orb.hp i{background:linear-gradient(#ff7a6a,#c4241f 45%,#7a100e)}
.orb.mp i{background:linear-gradient(#7ac4ff,#2a6fd0 45%,#143a80)}
.orb::after{content:'';position:absolute;left:14%;top:8%;width:38%;height:26%;border-radius:50%;background:rgba(255,255,255,.22);filter:blur(1px)}
.orb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:bold;text-shadow:0 1px 0 #000,0 0 4px #000;z-index:1}
.orb.low{animation:low .7s infinite}
@keyframes low{50%{box-shadow:0 0 0 2px #1a1220,0 0 18px 4px #e0201c,inset 0 0 12px #000}}
#mid{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:stretch}
#xpBar{position:relative;height:.9em;background:#120d16;border:1px solid #5b4a2c;border-radius:99px;overflow:hidden}
#xpFill{display:block;height:100%;width:0;background:linear-gradient(90deg,#b88a2a,#ffe066);transition:width .25s}
#lvTxt{position:absolute;inset:0;font-size:.68em;line-height:1.25;text-align:center;text-shadow:0 1px 0 #000;font-weight:bold}
#btns{display:flex;gap:clamp(3px,1vw,8px);justify-content:center}
.sk{--b:clamp(42px,10.5vmin,60px);position:relative;width:var(--b);height:var(--b);border-radius:8px;background:linear-gradient(#2b2236,#17111f);border:2px solid #8a6d3b;box-shadow:0 3px 0 #000;font-size:calc(var(--b)*.46);line-height:1;overflow:hidden;flex:none}
.sk:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.sk small{position:absolute;left:3px;top:2px;font-size:10px;color:#cfc6b4;text-shadow:0 1px 0 #000}
.sk em{position:absolute;right:3px;bottom:1px;font-size:10px;font-style:normal;color:#8fc4ff;text-shadow:0 1px 0 #000}
.sk b{position:absolute;right:3px;bottom:1px;font-size:12px;color:#fff;text-shadow:0 1px 0 #000}
.sk .cd{position:absolute;left:0;right:0;top:0;height:0;background:rgba(0,0,0,.72);pointer-events:none}
.sk.nomp{filter:saturate(.3) brightness(.7)}
.sk.atk{border-color:#b8433f}
.sk .fl{position:absolute;left:50%;top:50%;width:42%;height:52%;transform:translate(-50%,-42%);border-radius:30% 30% 46% 46%;border:2px solid #e9e4d0}
.sk .fl::before{content:'';position:absolute;left:28%;top:-34%;width:44%;height:30%;background:#e9e4d0;border-radius:2px}
.sk.hpp .fl{background:linear-gradient(#ff8a7a,#c4241f)}.sk.mpp .fl{background:linear-gradient(#8fd0ff,#2a6fd0)}
.sk.zero{filter:grayscale(1) brightness(.6)}
/* ── 화면(타이틀 · 선택 · 창) ── */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch}
.dim{background:rgba(4,3,8,.74);z-index:20}
#title{background:radial-gradient(ellipse at 50% 38%,#3a1f46 0,#160d1e 45%,#050308 100%);text-align:center;gap:.7em}
#title .kick{color:#c9a84e;letter-spacing:.3em;font-size:.85em}
#title h1{font-size:clamp(2.6em,13vmin,6em);line-height:1.05;color:#f2c14e;text-shadow:0 .06em 0 #5a2a10,0 .12em 0 #1a0a06,0 0 .5em rgba(255,120,40,.55);letter-spacing:.06em}
#title .sub{color:#e6dcc8;font-size:1.05em}
#title .cast{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,3vw,26px);margin:.4em 0;min-height:110px}
#title .cast canvas{image-rendering:pixelated;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}
#title .cast .vs{color:#b8433f;font-size:1.6em;font-weight:bold;align-self:center}
#title .foot{font-size:.78em;color:#9a8f7c;margin-top:.5em}
#title .foot a{color:#c9a84e}
.btn{display:inline-block;background:linear-gradient(#f7d166,#c9952a);color:#231405;font-weight:bold;font-size:1.1em;padding:.6em 1.6em;border-radius:8px;border:2px solid #2a1806;box-shadow:0 4px 0 #2a1806,0 0 18px rgba(255,180,60,.35);text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1806}
.btn.dark{background:linear-gradient(#3a2f48,#221a2e);color:#eee6d8;border-color:#8a6d3b;box-shadow:0 4px 0 #0a0710}
.btn.red{background:linear-gradient(#e2584c,#a8201c);color:#fff;border-color:#3a0806;box-shadow:0 4px 0 #3a0806}
.btn.sm{font-size:.9em;padding:.45em 1em}
#select{background:radial-gradient(ellipse at 50% 30%,#2a1f3a 0,#0d0914 70%);justify-content:flex-start}
#select h2{color:#f2c14e;font-size:1.5em;margin:.4em 0 .1em;text-align:center}
#select>p{color:#cfc6b4;font-size:.9em;text-align:center;margin-bottom:.8em}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:980px}
.card{flex:1 1 250px;max-width:310px;background:linear-gradient(#2a2233,#191321);border:2px solid #5b4a2c;border-radius:12px;padding:12px 14px 14px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.card:hover,.card:focus{transform:translateY(-4px);border-color:#f2c14e;box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 18px rgba(242,193,78,.25);outline:0}
.card canvas{image-rendering:pixelated;margin:2px auto 4px;display:block}
.card h3{color:#f2c14e;font-size:1.2em}
.card .tag{display:inline-block;margin:4px 0;padding:1px 10px;border-radius:99px;background:#3a2f48;border:1px solid #8a6d3b;font-size:.78em;color:#ffe9a8}
.card .d{font-size:.84em;color:#d8cfbd;min-height:2.6em}
.card .bars{margin:6px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font-size:.76em;text-align:left}
.card .bars i{display:block;height:.55em;border-radius:99px;background:#120d16;position:relative;overflow:hidden}
.card .bars i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--w);background:linear-gradient(90deg,#b88a2a,#ffe066)}
.card .skl{font-size:.78em;color:#cfc6b4;text-align:left;border-top:1px solid #3a3046;padding-top:6px;margin-top:4px}
.card .skl b{color:#fff}
.panel{width:min(94vw,640px);max-height:92vh;max-height:92dvh;overflow:auto;background:linear-gradient(#2a2233,#17111f);border:2px solid #8a6d3b;border-radius:12px;box-shadow:0 0 0 3px #120d18,0 18px 60px #000;padding:16px 18px 18px;animation:pop .18s ease-out}
.panel.wide{width:min(96vw,760px)}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.panel h2{color:#f2c14e;font-size:1.25em;text-align:center;margin-bottom:.35em}
.panel h3{color:#f2c14e;font-size:1em;margin:.9em 0 .3em}
.panel p{margin:.35em 0;color:#e6dcc8}
.panel .c{text-align:center}
.panel .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.qtag{display:inline-block;font-size:.76em;color:#9fe8ff;border:1px solid #2c6a85;border-radius:99px;padding:1px 10px;margin-bottom:6px}
.qq{font-size:1.12em;color:#fff;font-weight:bold;margin:.2em 0 .7em;line-height:1.45}
.ch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:linear-gradient(#352b44,#221a2e);border:2px solid #4a4058;border-radius:9px;padding:9px 12px;margin-top:8px;line-height:1.45;transition:border-color .1s,transform .1s}
.ch:hover{border-color:#f2c14e}.ch:active{transform:scale(.99)}
.ch .k{flex:none;width:1.6em;height:1.6em;border-radius:6px;background:#120d18;border:1px solid #8a6d3b;color:#f2c14e;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.9em}
.ch.ok{border-color:#4fd08a;background:linear-gradient(#1f4a36,#143024)}.ch.ok .k{background:#4fd08a;color:#06200f;border-color:#4fd08a}
.ch.no{border-color:#e2584c;background:linear-gradient(#4a1f1f,#301414)}.ch.no .k{background:#e2584c;color:#fff;border-color:#e2584c}
.ch[disabled]{cursor:default;opacity:.55}.ch.ok[disabled],.ch.no[disabled]{opacity:1}
.fb{margin-top:12px;border-radius:9px;padding:10px 12px;border:1px solid}
.fb.ok{border-color:#4fd08a;background:rgba(40,110,70,.22)}.fb.no{border-color:#e2584c;background:rgba(140,40,36,.22)}
.fb b{display:block;font-size:1.05em;margin-bottom:2px}.fb.ok b{color:#7be8a8}.fb.no b{color:#ff9a8f}
.fb .rw{margin-top:6px;font-size:.88em;color:#ffe9a8}
.grid2{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stat{flex:1 1 104px;min-width:0;background:#120d18;border:1px solid #3a3046;border-radius:8px;padding:7px 6px;text-align:center}
.stat b{display:block;color:#f2c14e;font-size:1.25em}.stat span{font-size:.75em;color:#b8ae9c}
.grade{font-size:clamp(3em,16vmin,5.5em);line-height:1;color:#f2c14e;text-shadow:0 .05em 0 #5a2a10,0 0 .4em rgba(255,150,40,.6);text-align:center;margin:.1em 0}
.steps6{counter-reset:s;display:grid;gap:5px;margin:8px 0}
.steps6 div{counter-increment:s;background:#120d18;border:1px solid #3a3046;border-radius:8px;padding:6px 10px 6px 2.4em;position:relative;font-size:.9em}
.steps6 div::before{content:counter(s);position:absolute;left:.6em;top:50%;transform:translateY(-50%);width:1.4em;height:1.4em;border-radius:50%;background:#f2c14e;color:#231405;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:.85em}
.rev{background:#120d18;border:1px solid #3a3046;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.88em}
.rev .q{color:#fff;font-weight:bold}.rev .a{color:#7be8a8;margin-top:2px}.rev .e{color:#b8ae9c;margin-top:2px;font-size:.92em}
.gear{display:flex;gap:10px;align-items:center;background:#120d18;border:1px solid #3a3046;border-radius:8px;padding:7px 10px;margin-top:6px}
.gear .sl{flex:none;width:3.6em;color:#b8ae9c;font-size:.8em}.gear .nm{font-weight:bold}.gear .fx{font-size:.78em;color:#b8ae9c}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9em;margin:6px 0}
.keys kbd{background:#120d18;border:1px solid #8a6d3b;border-radius:5px;padding:0 7px;color:#f2c14e;font-family:inherit;white-space:nowrap;text-align:center}
.warnbox{border:1px solid #c0504a;background:rgba(140,40,36,.22);border-radius:9px;padding:8px 12px;margin-top:8px;color:#ffc9c2;font-size:.92em}
.okbox{border:1px solid #4fd08a;background:rgba(40,110,70,.22);border-radius:9px;padding:8px 12px;margin-top:8px;color:#bff3d3;font-size:.92em}
@media (max-width:520px){ #mini{width:30vw} .sk small{display:none} #obj{display:none} #bossBar{top:auto;bottom:calc(clamp(54px,13vmin,84px) + 44px);width:86vw} }
@media (max-height:520px){ #toasts{top:14%} .orb{--s:clamp(46px,16vmin,64px)} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="world"></canvas>
  <canvas id="fx"></canvas>
  <div id="hurt"></div>
  <div id="hud" class="hidden">
    <div id="topL"><div id="floorName"></div><div id="obj"></div><div id="runeRow"><span class="rn" title="질서의 룬 (첫 도전에 맞힌 문제 수)"><i></i><b id="runeN">0</b>/20</span><span id="staffRow"></span></div></div>
    <div id="topR"><canvas id="mini" width="96" height="60"></canvas><div class="tbtns"><button id="bChar" title="캐릭터 (C)">🎒</button><button id="bHelp" title="도움말 (H)">❓</button><button id="bMute" title="소리 (M)">🔊</button><button id="bFull" title="전체 화면 (F)">⛶</button></div></div>
    <div id="bossBar" class="hidden"><div id="bossName"></div><div class="bar"><i id="bossFill"></i></div><div id="bossVeil"></div></div>
    <div id="toasts"></div>
    <div id="bannerWrap"></div>
    <div id="bottom">
      <div class="orb hp" id="orbHp"><i id="hpFill"></i><span id="hpTxt"></span></div>
      <div id="mid">
        <div id="xpBar"><i id="xpFill"></i><span id="lvTxt">Lv.1</span></div>
        <div id="btns">
          <button class="sk atk" id="bAtk" title="가까운 적 공격 · 열기 (Space)">⚔<small>Space</small></button>
          <button class="sk" id="bQ"><span id="icQ"></span><i class="cd" id="cdQ"></i><small>Q</small><em id="mpQ"></em></button>
          <button class="sk" id="bW"><span id="icW"></span><i class="cd" id="cdW"></i><small>W</small><em id="mpW"></em></button>
          <button class="sk hpp" id="bHp" title="체력 물약 (1)"><span class="fl"></span><i class="cd" id="cdHp"></i><small>1</small><b id="nHp">0</b></button>
          <button class="sk mpp" id="bMp" title="마력 물약 (2)"><span class="fl"></span><small>2</small><b id="nMp">0</b></button>
        </div>
      </div>
      <div class="orb mp" id="orbMp"><i id="mpFill"></i><span id="mpTxt"></span></div>
    </div>
  </div>
  <div id="fade"></div>
  <div id="title" class="screen">
    <div class="kick">SBA 3주차 · 내 종합봇 짓기</div>
    <h1>혼돈의 성</h1>
    <div class="sub">여섯 직원을 구하고, 혼돈의 군주 「뒤죽박죽」을 봉인하라</div>
    <div class="cast" id="cast"></div>
    <button class="btn" id="bStart">모험 시작</button>
    <div class="foot">퀴즈를 맞히면 장비 · 물약 · 룬을 얻습니다 · 약 15~20분<br><a id="lkPrep" href="sba-prep.html#w3-flow">← SBA 준비사항으로</a></div>
  </div>

function tileFloor(P,seed,alt){
  const c=mk(16,16),g=c.getContext('2d'),r=mulberry(seed*7919+13);
  g.fillStyle=alt?P.dark:P.base; g.fillRect(0,0,16,16);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const v=r(); if(v<.09)R(g,alt?P.line:P.dark,x,y,1,1); else if(v<.15)R(g,alt?P.base:P.lite,x,y,1,1)}
  if(P.style==='slab'){R(g,P.line,0,15,16,1);R(g,P.line,15,0,1,16);R(g,P.lite,0,0,15,1); if(r()<.5){const s=5+(r()*6|0);R(g,P.line,s,0,1,15)} else {const s=5+(r()*6|0);R(g,P.line,0,s,15,1)}
    if(r()<.45){let x=3+(r()*9|0),y=2+(r()*4|0);for(let i=0;i<7;i++){R(g,P.line,x,y,1,1);r()<.5?x+=r()<.5?1:-1:y++}}
    if(P.moss&&r()<.4){const x=1+(r()*11|0),y=1+(r()*11|0);R(g,P.moss,x,y,2,1);R(g,P.moss,x+1,y+1,2,1);R(g,P.moss,x-1,y+1,1,1)}}
  if(P.style==='plank'){for(let y=3;y<16;y+=4)R(g,P.line,0,y,16,1);const o=r()*12|0;R(g,P.line,o,0,1,3);R(g,P.line,(o+7)%16,4,1,3);R(g,P.line,(o+3)%16,8,1,3);R(g,P.line,(o+11)%16,12,1,3);R(g,P.lite,(o+1)%16,1,1,1);R(g,P.lite,(o+8)%16,5,1,1)}
  if(P.style==='marble'){R(g,P.line,0,15,16,1);R(g,P.line,15,0,1,16);R(g,P.lite,0,0,15,1);R(g,P.lite,0,0,1,15); if(r()<.6){let x=r()*10|0,y=2+(r()*4|0);for(let i=0;i<9;i++){R(g,P.lite,x,y,1,1);x++;if(r()<.5)y++}}}
  if(P.style==='obsid'){R(g,P.line,0,15,16,1);R(g,P.line,15,0,1,16); if(r()<.4){let x=2+(r()*10|0),y=1;for(let i=0;i<12&&y<15;i++){R(g,P.lava,x,y,1,1);R(g,'#5a2414',x+1,y,1,1);r()<.4?x+=r()<.5?1:-1:y++}}}
  return c;
}
function tileFace(P,seed){
  const c=mk(16,16),g=c.getContext('2d'),r=mulberry(seed*104729+7);
  g.fillStyle=P.wall; g.fillRect(0,0,16,16);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const v=r(); if(v<.12)R(g,P.wdark,x,y,1,1)}
  for(let row=0;row<4;row++){const y=row*4+3;R(g,P.mort,0,y,16,1);const o=(row%2?4:0)+(seed%2?2:0);for(let x=o%8;x<16;x+=8)R(g,P.mort,x,y-3,1,3)}
  R(g,P.cap,0,0,16,2);R(g,P.mort,0,2,16,1);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,12,16,4);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,14,16,2);
  return c;
}
function tileTop(P,seed){
  const c=mk(16,16),g=c.getContext('2d'),r=mulberry(seed*31337+3);
  g.fillStyle=P.top; g.fillRect(0,0,16,16);
  for(let i=0;i<10;i++)R(g,'rgba(255,255,255,.035)',r()*16|0,r()*16|0,2,1);
  return c;
}
function buildTheme(name){
  const P=THEMES[name]; if(P.t) return P.t;
  P.t={floor:[1,2,3,4,5,6].map(s=>tileFloor(P,s,0)),alt:[7,8,9].map(s=>tileFloor(P,s,1)),face:[1,2,3].map(s=>tileFace(P,s)),top:[1,2].map(s=>tileTop(P,s))};
  return P.t;
}

function toggleMute(){ setMute(!AU.mute); $('#bMute').textContent=AU.mute?'🔇':'🔊'; }
function toggleFull(){ const d=document; if(d.fullscreenElement) d.exitFullscreen(); else if(d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(()=>{}); }
/* ----- 타이틀 · 직업 선택 · 시작 ----- */
function sprCanvas(names,scale,w,h){ // 미리보기용 확대 그림
  const c=mk(w*scale,h*scale),g=c.getContext('2d'); g.imageSmoothingEnabled=false; names.forEach(([n,x,y,rot])=>{const s=SPR[n]; g.save(); g.translate(x*scale,y*scale); if(rot)g.rotate(rot); g.drawImage(s,0,0,s.width*scale,s.height*scale); g.restore()}); c.style.width=c.width+'px'; c.style.height=c.height+'px'; return c;
}
function heroCanvas(cls,scale){ const c=CLS[cls]; return sprCanvas(cls==='knight'?[['sword',19,2,.35],['knight',1,4]]:cls==='mage'?[['staff',20,1,.1],['mage',1,4]]:[['bow',18,6,0],['ranger',1,4]],scale,26,23); }
function initTitle(){
  const lk=$('#lkPrep'); if(lk) lk.href=PREP;
  const cast=$('#cast'),nar=innerWidth<470,sc=nar?3:4; ['knight','mage','ranger'].forEach(k=>cast.appendChild(heroCanvas(k,sc)));
  if(!nar){const vs=document.createElement('div'); vs.className='vs'; vs.textContent='VS'; cast.appendChild(vs)} else cast.style.gap='4px'; cast.appendChild(sprCanvas([['boss',0,0]],sc,34,32));
  $('#bStart').onclick=()=>{auInit();sfx('ui');hide($('#title'));showSelect()};
  $('#bMute').textContent=AU.mute?'🔇':'🔊';
}
function showSelect(){
  G.state='select'; const box=$('#cards'); box.innerHTML='';
  Object.values(CLS).forEach(c=>{
    const d=document.createElement('button'); d.className='card'; d.appendChild(heroCanvas(c.id,innerWidth<520?4:5));
    d.insertAdjacentHTML('beforeend',`<h3>${c.name}</h3><span class="tag">${c.tagDesc}</span><div class="d">${c.desc}</div><div class="bars">${c.bars.map(([n,v])=>`<span>${n}</span><i style="--w:${v*20}%"></i>`).join('')}</div><div class="skl"><b>${c.q.icon} ${c.q.name}</b> — ${c.q.desc}<br><b>${c.w.icon} ${c.w.name}</b> — ${c.w.desc}</div>`);
    d.onclick=()=>{auInit();sfx('ok');startGame(c.id)}; box.appendChild(d);
  });
  show($('#select')); $('#select').scrollTop=0;
}
function toSelect(){ hide($('#modal')); hide($('#hud')); hudBossHide(); G.fl=null; G.p=null; G.bf=null; wg.fillStyle='#000'; wg.fillRect(0,0,G.VW,G.VH); fg.setTransform(1,0,0,1,0,0); fg.clearRect(0,0,fc.width,fc.height); showSelect(); }
function startGame(cls,skipIntro){
  hide($('#select')); hide($('#title'));
  G.floors=FLOORS.map((d,i)=>buildFloor(d,i)); G.p=newPlayer(cls); G.qr={}; G.staffFree=[0,0,0,0,0,0]; G.bf=null; G.t=0; G.streak=0; G.after=[]; G.hints={}; G.barMon=null;
  G.stats={first:0,asked:0,deaths:0,kills:0,dmg:0,taken:0,gold:0,pots:0,skills:0,lvl:1,floor:1,time:0,log:[]};
  hudInit(); enterFloor(0,true); G.state='play';
  if(skipIntro) return;
  const pages=[
    `<h2>혼돈의 성</h2><p>평화롭던 콘텐츠 왕국에 혼돈의 군주 <b>「뒤죽박죽」</b>이 나타났습니다.</p><p>폴더는 흩어지고, 지침서는 찢기고, 길드의 <b>여섯 직원</b>은 지하 성채에 갇혔습니다.</p><p>그대는 신임 <b>팀장</b>. 성채로 내려가 질서를 되찾으십시오.</p>`,
    `<h2>질서의 시험</h2><p>성채 곳곳의 <b>봉인된 궤</b>에는 수업 내용 퀴즈가 걸려 있습니다.</p><p>· <b>첫 도전에 맞히면</b> — 질서의 룬 · 장비 · 물약<br>· <b>틀리면</b> — 혼돈의 저주, 보상 없음</p><p>물약과 장비가 없으면 깊은 층에서 버틸 수 없습니다. 그리고 룬이 <b>${RUNE_NEED}개</b>보다 적으면 군주의 <b>장막</b>을 뚫지 못합니다.</p>`,
    `<h2>조작법</h2><div class="keys"><kbd>클릭 · 탭</kbd><span>이동 · 공격 · 궤 열기</span><kbd>Space · ⚔</kbd><span>가까운 적 공격</span><kbd>Q · W</kbd><span>기술</span><kbd>1 · 2</kbd><span>체력 · 마력 물약</span></div><p class="c" style="margin-top:8px">먼저 가까운 <b>빛나는 궤</b>를 찾아가 보세요.</p>`];
  let i=0; const next=()=>{ if(i>=pages.length){ later(.6,()=>toast('바닥을 클릭(탭)하면 이동합니다. 몬스터를 누르면 공격!')); return; } const last=i===pages.length-1; dialog(pages[i++],[{t:last?'모험 시작':'다음',fn:next}]); };
  next();
}
/* ---------- 입력 · 메인 루프 · 시작 ---------- */
function command(cx,cy){
  const p=G.p,fl=G.fl,w=s2w(cx,cy),touch=G.ptr.type!=='mouse';
  let best=null,bd=1e9;
  for(const m of fl.mons){ if(m.dead||!fl.vis[Math.floor(m.y)*fl.w+Math.floor(m.x)])continue; const sc=m.d.scale||1,d=Math.min(hyp(m.x-w.x,m.y-w.y),hyp(m.x-w.x,m.y-.6*sc-w.y)),lim=m.r+(touch?.8:.45)+(sc-1)*.5; if(d<lim&&d<bd){bd=d;best=m} }
  if(best){p.tgt=best;p.itgt=null;p.path=null;p.rep=0;return}
  let bo=null; bd=touch?1.0:.8;
  for(const o of fl.objs){ if(!o.inter||o.gone||!fl.exp[o.j*fl.w+o.i])continue; const d=Math.min(hyp(o.x-w.x,o.y-w.y),hyp(o.x-w.x,o.y-.6-w.y)); if(d<bd){bd=d;bo=o} }
  if(bo){ p.itgt=bo;p.tgt=null; if(!goAdj(bo)&&hyp(bo.x-p.x,bo.y-p.y)>1.45){p.itgt=null} return; }
  p.tgt=null;p.itgt=null; const pa=pathTo(fl,p,w.x,w.y,true); if(pa){p.path=pa;G.marks.push({x:w.x,y:w.y,t:0})}
}
function bindInput(){
  fc.addEventListener('pointerdown',e=>{ e.preventDefault(); auInit(); G.ptr.type=e.pointerType||'mouse'; G.ptr.x=e.clientX; G.ptr.y=e.clientY; if(G.state!=='play'||!G.p||G.p.dead) return;
    G.ptr.down=true; G.ptr.hold=.22; try{fc.setPointerCapture(e.pointerId)}catch(_){} command(e.clientX,e.clientY); });
  fc.addEventListener('pointermove',e=>{G.ptr.x=e.clientX;G.ptr.y=e.clientY;G.ptr.seen=true;G.ptr.type=e.pointerType||'mouse'});
  ['pointerup','pointercancel'].forEach(n=>fc.addEventListener(n,()=>{G.ptr.down=false}));
  fc.addEventListener('contextmenu',e=>e.preventDefault());
  const tap=(id,fn)=>{$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();auInit();fn()})};
  tap('#bAtk',attackNearest); tap('#bQ',()=>castSkill('q')); tap('#bW',()=>castSkill('w')); tap('#bHp',()=>usePotion('hp')); tap('#bMp',()=>usePotion('mp'));
  $('#bChar').onclick=openChar; $('#bHelp').onclick=openHelp; $('#bMute').onclick=toggleMute; $('#bFull').onclick=toggleFull; if(!document.documentElement.requestFullscreen) $('#bFull').classList.add('hidden'); // 아이폰 사파리 등 전체 화면 미지원
  addEventListener('keydown',e=>{
    const c=e.code;
    if(G.state==='quiz'){ const n=c.startsWith('Digit')?+c.slice(5):c.startsWith('Numpad')?+c.slice(6):0; if(QC&&!QC.done&&n>=1&&n<=4){answer(n-1);e.preventDefault()} else if(QC&&QC.done&&(c==='Enter'||c==='Space'||c==='NumpadEnter')){closeQuiz();e.preventDefault()} return; }
    if(G.state==='dialog'){ const bs=$$('#panel .btn'); if(!bs.length) return; if(c==='Enter'||c==='NumpadEnter'){bs[0].click();e.preventDefault()} else if(c==='Escape'){bs[bs.length-1].click();e.preventDefault()} return; }
    if(c.startsWith('Arrow')){G.keys[c]=true;e.preventDefault();return}
    if(G.state!=='play'||e.repeat&&c!=='Space') return;
    if(c==='KeyQ')castSkill('q'); else if(c==='KeyW')castSkill('w'); else if(c==='Digit1'||c==='Numpad1')usePotion('hp'); else if(c==='Digit2'||c==='Numpad2')usePotion('mp');
    else if(c==='Space'){attackNearest();e.preventDefault()} else if(c==='KeyE'){const o=nearestInter(2.4);if(o){G.p.itgt=o;G.p.tgt=null;goAdj(o)}}
    else if(c==='KeyC'||c==='KeyI')openChar(); else if(c==='KeyH')openHelp(); else if(c==='KeyM')toggleMute(); else if(c==='KeyF')toggleFull();
  });
  addEventListener('keyup',e=>{if(e.code.startsWith('Arrow'))G.keys[e.code]=false});
  addEventListener('blur',()=>{G.keys={};G.ptr.down=false});
}
let _last=0,_mini=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-_last)/1000||.016); _last=now; const steps=G.speed||1;
  for(let s=0;s<steps;s++){
    if(G.after.length){ for(const a of G.after)a.t-=dt; const due=G.after.filter(a=>a.t<=0); if(due.length){G.after=G.after.filter(a=>a.t>0);due.forEach(a=>a.fn())} }
    if(G.fl&&G.p){ if(G.state==='play'){ if(G.hitStop>0)G.hitStop-=dt; else update(dt); } updFx(dt); }
    if(window.__auto) window.__auto(dt);
  }
  if(G.fl&&G.p){ render(dt); hudUpdate(); _mini-=dt; if(_mini<=0){_mini=.2;drawMini()} }
}
function boot(){
  buildSprites(); initCanvas(); initTitle(); bindInput(); requestAnimationFrame(frame);
  if(QS.get('cls')&&CLS[QS.get('cls')]){ startGame(QS.get('cls'),true); }
}
boot();
</script>
