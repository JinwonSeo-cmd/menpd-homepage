<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-class-title>강의 진행</title>
<style>
  :root {
    --accent: #2563eb;
    --bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
    background: #f9fafb;
    color: var(--text);
  }
  header {
    background: var(--accent);
    color: white;
    padding: 24px 16px;
  }
  header h1 { margin: 0 0 4px; font-size: 1.3rem; }
  header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }
  header .meta { margin-top: 8px; font-size: 0.8rem; opacity: 0.8; }
  .qr-toggle {
    margin-top: 12px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .qr-box {
    display: none;
    margin-top: 12px;
    background: white;
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    text-align: center;
    max-width: 180px;
  }
  .qr-box.open { display: block; }
  .short-url { font-size: 0.85rem; margin: 0 0 8px; word-break: break-all; }

  main { max-width: 720px; margin: 0 auto; padding: 16px; }

  nav.toc {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 16px;
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav.toc a {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    background: #f3f4f6;
    color: var(--text);
    text-decoration: none;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .class-part {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    scroll-margin-top: 60px;
  }
  .class-part h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .part-summary { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }

  .prompt-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    background: #f9fafb;
  }
  .prompt-card-head { display: flex; gap: 8px; margin-bottom: 6px; }
  .prompt-category, .prompt-tool {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: #e0e7ff;
    color: #3730a3;
  }
  .prompt-tool { background: #d1fae5; color: #065f46; }
  .prompt-title { margin: 0 0 6px; font-size: 0.95rem; }
  .prompt-body {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 0.85rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin: 0 0 8px;
    max-height: 240px;
    overflow-y: auto;
  }
  .copy-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .copy-btn.copied { background: #16a34a; }
</style>
</head>
<body>
  <header>
    <h1 data-class-title>강의 로딩 중...</h1>
    <p data-class-subtitle></p>
    <div class="meta" data-class-meta></div>
    <button class="qr-toggle" type="button" id="qrToggleBtn">강의 시작 QR 보기</button>
    <div class="qr-box" data-class-qr id="qrBox"></div>
  </header>

  <nav class="toc" data-toc></nav>

  <main>
    <div data-parts></div>
  </main>

  <script src="js/components.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const classId = params.get("id") || "generative-ai-7hrs";
    renderClassPage(classId).then(() => {
      // 목차 자동 생성
      const toc = document.querySelector("[data-toc]");
      document.querySelectorAll(".class-part").forEach((el) => {
        const a = document.createElement("a");
        a.href = `#${el.id}`;
        a.textContent = el.querySelector("h3").textContent.replace(/^Part \d+\.\s*/, "");
        toc.appendChild(a);
      });
    });
    document.getElementById("qrToggleBtn").addEventListener("click", () => {
      document.getElementById("qrBox").classList.toggle("open");
    });
  </script>
</body>
</html>
