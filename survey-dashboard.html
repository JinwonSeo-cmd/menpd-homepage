<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 사전 설문 대시보드</title>
<style>
  :root{
    --ink:#24333E;
    --paper:#F6F4EF;
    --card:#FFFFFF;
    --accent:#3F7C74;
    --accent-dark:#2E5D56;
    --line:#DFDACB;
    --muted:#6B7680;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;}

  .dash-title{font-size:22px;font-weight:700;margin:0 0 4px;}
  .dash-sub{color:var(--muted);font-size:14px;margin:0 0 16px;}
  .dash-stats{display:flex;gap:10px;margin-bottom:6px;}
  .stat-pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex:1;text-align:center;}
  .stat-num{font-size:24px;font-weight:700;color:var(--accent-dark);}
  .stat-lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .refresh-btn{
    width:100%;margin-top:14px;padding:12px;border-radius:10px;
    border:1.5px solid var(--accent);background:transparent;color:var(--accent-dark);
    font-weight:600;font-size:14px;cursor:pointer;
  }
  .updated-note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;}

  .filter-row{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  }
  .filter-row label{font-size:13px;color:var(--muted);white-space:nowrap;}
  .filter-row select{
    flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);font-size:14px;font-family:inherit;
  }

  .dash-section{margin-top:28px;}
  .dash-q{font-size:15px;font-weight:700;margin:0 0 12px;line-height:1.4;}
  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px;}
  .bar-label span:first-child{flex:1;}
  .bar-track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}

  .text-answers{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;}
  .text-answer-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;}
  .text-answer-name{font-weight:700;color:var(--accent-dark);font-size:12px;margin-bottom:3px;}
  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .warn-note{
    background:#FBF1E1;border:1px solid #EBD3A0;color:#7A5A17;
    border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:20px;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="dash-title">강의 사전 설문 대시보드</div>
  <div class="dash-sub">불러오는 중…</div>
</div>

<script>
// ⚠️ 폼이 바뀌거나 시트를 새로 만들면, 아래 SHEET_ID와 GID를 시트 편집 화면 주소창에서 다시 확인해 바꿔주세요.
// 편집 주소 형태: https://docs.google.com/spreadsheets/d/[SHEET_ID]/edit?...#gid=[GID]
const SHEET_ID = "1rU5W2rH7Cw1Qk9z7hLSdhmANXUSOjM47CZ1qlOUUttg";
const GID = "1837557039";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

const ALL_SESSIONS_VALUE = "__ALL__";
const app = document.getElementById('app');

let ALL_HEADERS = [];
let ALL_DATA = [];
let currentSession = ALL_SESSIONS_VALUE;
let lastUpdated = null;

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim().length));
}

function escapeHtml(str){
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

async function load(){
  app.innerHTML = `<div class="dash-title">강의 사전 설문 대시보드</div><div class="dash-sub">불러오는 중…</div>`;
  try{
    const res = await fetch(CSV_URL, {cache:'no-store'});
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 1){ throw new Error('empty sheet'); }
    const headers = rows[0];
    const data = rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h,i) => obj[h] = (r[i]||'').trim());
      return obj;
    });
    ALL_HEADERS = headers;
    ALL_DATA = data;
    lastUpdated = new Date();
    renderDashboard();
  }catch(err){
    app.innerHTML = `
      <div class="dash-title">불러오기 실패</div>
      <div class="dash-sub">${escapeHtml(err.message)}</div>
      <button class="refresh-btn" id="retry">다시 시도</button>`;
    document.getElementById('retry').onclick = load;
  }
}

function renderDashboard(){
  const headers = ALL_HEADERS;
  const nicknameKeywords = ['닉네임', '별명', '성함', '이름'];
  const nicknameCol = headers.find(h => nicknameKeywords.some(k => h.includes(k))) || headers[1];

  const sessionKeywords = ['세션', '분반', '반 이름', '반명', '반이름'];
  const sessionCol = headers.find(h => sessionKeywords.some(k => h.includes(k)));

  let filterHtml = '';
  let data = ALL_DATA;

  if (sessionCol){
    const sessions = [...new Set(ALL_DATA.map(d => d[sessionCol]).filter(v => v && v.length))].sort();
    if (currentSession !== ALL_SESSIONS_VALUE && !sessions.includes(currentSession)){
      currentSession = ALL_SESSIONS_VALUE;
    }
    data = (currentSession === ALL_SESSIONS_VALUE) ? ALL_DATA : ALL_DATA.filter(d => d[sessionCol] === currentSession);

    filterHtml = `
      <div class="filter-row">
        <label for="session-select">반 선택</label>
        <select id="session-select">
          <option value="${ALL_SESSIONS_VALUE}" ${currentSession===ALL_SESSIONS_VALUE?'selected':''}>전체 (${ALL_DATA.length}명)</option>
          ${sessions.map(s => {
            const cnt = ALL_DATA.filter(d => d[sessionCol] === s).length;
            return `<option value="${escapeAttr(s)}" ${currentSession===s?'selected':''}>${escapeHtml(s)} (${cnt}명)</option>`;
          }).join('')}
        </select>
      </div>`;
  }

  const skipCols = new Set([headers[0], nicknameCol]);
  if (sessionCol) skipCols.add(sessionCol);
  const qCols = headers.filter(h => !skipCols.has(h));

  let sectionsHtml = '';
  qCols.forEach(col => {
    const values = data.map(d => d[col]).filter(v => v && v.length);
    if (values.length === 0){
      sectionsHtml += `
        <div class="dash-section">
          <div class="dash-q">${escapeHtml(col)}</div>
          <div class="empty-note">아직 답변이 없어요</div>
        </div>`;
      return;
    }
    const uniq = [...new Set(values)];
    const avgLen = values.reduce((a,v) => a + v.length, 0) / values.length;
    const isCategorical = uniq.length <= 10 && avgLen <= 30;

    if (isCategorical){
      const counts = {};
      uniq.forEach(u => counts[u] = 0);
      values.forEach(v => counts[v]++);
      const total = values.length;
      const sortedKeys = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
      sectionsHtml += `
        <div class="dash-section">
          <div class="dash-q">${escapeHtml(col)}</div>
          ${sortedKeys.map(k => {
            const c = counts[k];
            const pct = Math.round((c/total)*100);
            return `
              <div class="bar-row">
                <div class="bar-label"><span>${escapeHtml(k)}</span><span>${c}명 (${pct}%)</span></div>
                <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
              </div>`;
          }).join('')}
        </div>`;
    } else {
      sectionsHtml += `
        <div class="dash-section">
          <div class="dash-q">${escapeHtml(col)}</div>
          <div class="text-answers">
            ${data.filter(d => d[col] && d[col].length).map(d => `
              <div class="text-answer-card">
                <div class="text-answer-name">${escapeHtml(d[nicknameCol] || '익명')}</div>
                ${escapeHtml(d[col])}
              </div>`).join('')}
          </div>
        </div>`;
    }
  });

  const warnHtml = sessionCol ? '' : `
    <div class="warn-note">
      ⚠️ 이 시트에는 "반"을 구분하는 문항이 없어요. 지금은 폼에 쌓인 모든 응답이 한 번에 표시됩니다.
      여러 반에 이 폼을 계속 쓰실 계획이면, 폼에 "세션 ID" 같은 질문을 하나 추가하면 이 페이지에 반 선택 드롭다운이 자동으로 생겨요.
    </div>`;

  app.innerHTML = `
    <div class="dash-title">강의 사전 설문 대시보드</div>
    <div class="dash-sub">실시간 응답 현황</div>
    ${filterHtml}
    <div class="dash-stats">
      <div class="stat-pill"><div class="stat-num">${data.length}</div><div class="stat-lbl">참여 인원</div></div>
    </div>
    <button class="refresh-btn" id="refresh-btn">새로고침</button>
    <div class="updated-note">마지막 업데이트: ${lastUpdated ? lastUpdated.toLocaleString('ko-KR') : ''}</div>
    ${warnHtml}
    ${data.length === 0 ? '<div class="empty-note">아직 제출된 응답이 없어요.</div>' : sectionsHtml}
  `;

  const sel = document.getElementById('session-select');
  if (sel){
    sel.onchange = (e) => { currentSession = e.target.value; renderDashboard(); };
  }
  document.getElementById('refresh-btn').onclick = load;
}

load();
</script>
</body>
</html>
