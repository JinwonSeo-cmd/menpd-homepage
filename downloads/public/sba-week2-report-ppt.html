<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>온도 성수 본점 · 10월 매장 운영 보고</title>
<!--
  보고서봇 템플릿 ① PPT형 (PC 공식 자료 · 16:9 슬라이드)
  ▶ 봇은 아래 <script id="data"> 안의 DATA 값만 KB 숫자로 바꾼다. 디자인 코드는 건드리지 않는다.
  ▶ 넘기기 : → ← 키 · 마우스 휠 · 클릭 / 인쇄(Ctrl+P) → PDF 저장하면 장마다 한 쪽
-->
<style>
:root{--br:#4A2C21;--cr:#F5EBDD;--tc:#D9734E;--ink:#2B1A12;--mut:#8A7566;--bg:#FBF6EF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1d1410;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
#deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.sl{position:absolute;width:1280px;height:720px;background:var(--bg);transform-origin:center;padding:64px 80px;display:none;overflow:hidden}
.sl.on{display:block;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:scale(var(--s)) translateY(14px)}to{opacity:1;transform:scale(var(--s))}}
.sl{transform:scale(var(--s))}
.hd{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.no{background:var(--br);color:var(--cr);font-weight:800;font-size:15px;padding:6px 14px;border-radius:8px}
.tt{font-size:34px;font-weight:800;letter-spacing:-.5px}
.ft{position:absolute;left:80px;right:80px;bottom:28px;display:flex;justify-content:space-between;font-size:13px;color:var(--mut);border-top:1px solid #E6D9CA;padding-top:10px}
.cover{background:var(--br);color:var(--cr);display:none;flex-direction:column;justify-content:center}
.cover.on{display:flex}
.cover .k{color:var(--tc);font-weight:700;font-size:20px;margin-bottom:18px}
.cover h1{font-size:64px;line-height:1.2;font-weight:800}
.cover p{margin-top:24px;font-size:20px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.kpi{background:#fff;border-radius:18px;padding:30px 26px;box-shadow:0 2px 0 #EADCCB}
.kpi .l{font-size:16px;color:var(--mut)}
.kpi .v{font-size:46px;font-weight:800;margin:10px 0 6px;color:var(--br)}
.kpi .u{font-size:20px;margin-left:4px}
.kpi .d{font-size:15px;font-weight:700;color:var(--tc)}
.sum{margin-top:34px;background:var(--cr);border-left:6px solid var(--tc);border-radius:12px;padding:22px 26px;font-size:21px;line-height:1.6}
.row{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:start}
.card{background:#fff;border-radius:18px;padding:26px 28px}
.card h3{font-size:18px;color:var(--mut);margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:22px;height:300px;padding-top:20px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:var(--br);border-radius:10px 10px 0 0;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.bar.hi i{background:var(--tc)}
.bar b{font-size:16px;margin-bottom:6px}
.bar span{font-size:14px;color:var(--mut);margin-top:8px}
.hb{margin:12px 0}
.hb .t{display:flex;justify-content:space-between;font-size:16px;margin-bottom:6px}
.hb .tr{height:16px;background:#EFE4D6;border-radius:8px;overflow:hidden}
.hb .tr i{display:block;height:100%;width:0;background:var(--br);border-radius:8px;transition:width 1s ease}
.donut{display:flex;align-items:center;gap:30px}
.lg div{display:flex;align-items:center;gap:10px;font-size:17px;margin:10px 0}
.lg s{width:14px;height:14px;border-radius:4px;display:inline-block}
ul.pt{list-style:none}
ul.pt li{font-size:20px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px dashed #E6D9CA}
ul.pt li:before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--tc)}
.flow{display:flex;align-items:center;gap:14px;margin-top:20px}
.flow div{flex:1;background:#fff;border-radius:14px;padding:18px;text-align:center;font-size:17px;font-weight:700}
.flow div small{display:block;font-weight:400;color:var(--mut);margin-top:6px}
.flow em{color:var(--tc);font-style:normal;font-size:26px}
.pg{position:fixed;right:20px;bottom:14px;color:#c9b9a8;font-size:13px}
@media print{@page{size:1280px 720px;margin:0}body{background:none}#deck{position:static;display:block}.sl,.cover{display:block!important;position:relative;transform:none!important;page-break-after:always;animation:none}.cover{display:flex!important}.bar i,.hb .tr i{transition:none}.pg{display:none}}
</style>
</head>
<body>
<script id="data">
/* ===== 봇은 여기 숫자 · 문구만 바꾼다 (KB 원문 그대로) ===== */
const DATA={
  title:"10월 매장 운영 보고",
  sub:"온도(ONDO) 성수 본점 · 2026년 10월",
  writer:"온도 매장운영팀 · 수업용 가상 데이터",
  kpi:[["총매출","6,840","만 원","전월 대비 +10.1%"],["영업이익","1,650","만 원","이익률 24.1%"],["일평균 손님","412","명","객단가 5,355원"],["신규 멤버십","486","명","전월 대비 +38%"]],
  summary:"매출은 전월 대비 10.1%, 신규 멤버십은 38% 늘었습니다. 주말 오후 인원을 증원했고, 콘센트 부족 의견 27건에 따라 11월 추가 설치를 준비합니다.",
  monthly:[["7월",5620],["8월",5980],["9월",6210],["10월",6840]],
  weekly:[["1주",1400],["2주",1500],["3주",1580],["4주",1670],["5주",690]],
  mix:[["음료",68,"#4A2C21"],["디저트",18,"#D9734E"],["원두 · 굿즈",14,"#C9A27E"]],
  cost:[["원재료",2050],["인건비",1830],["임대료",750],["공과금",260],["마케팅",180],["기타",120]],
  costTotal:"총지출 5,190만 원 · 영업이익 1,650만 원",
  staff:["정직원 4명 + 파트타이머 8명","총 근무 1,620시간 · 1인 평균 135시간","주말 13~17시 피크 → 인원 2명 → 3명","평일 오전 파트타이머 1명 모집 중","라떼아트 교육 2회 (9명 참여)"],
  guest:[["재방문율",38],["리뷰 4.7/5 (백분율 환산)",94],["출근 08~10시",22],["점심 12~14시",26],["오후 14~17시",31],["저녁 17~21시",21]],
  menu:[["36.5 라떼",4120],["아메리카노",3860],["온도 블렌드 드립",1940],["바닐라빈 라떼",1310],["말차 라떼",980]],
  issues:["고객 의견 1위 : 2층 콘센트 부족 (27건)","2층 냉난방기 교체 — 11월 첫 주 2층 반나절 휴무","원두 납품가 4% 인상 예고 (12월부터)"],
  next:[["11.20 ~ 22","2주년 고마운 온도 주간"],["11.20","흑임자 라떼 출시"],["11월","2층 콘센트 12구 추가"]]
};
</script>
<div id="deck"></div>
<div class="pg" id="pg"></div>
<script>
const D=DATA,deck=document.getElementById('deck');
const ft=n=>`<div class="ft"><span>${D.sub} · ${D.writer}</span><span>${n}</span></div>`;
const hd=(n,t)=>`<div class="hd"><span class="no">${String(n).padStart(2,'0')}</span><span class="tt">${t}</span></div>`;
const mx=a=>Math.max(...a.map(x=>x[1]));
let S=[];
S.push(`<section class="sl cover"><div class="k">${D.sub}</div><h1>${D.title}</h1><p>${D.writer}</p></section>`);
S.push(`<section class="sl">${hd(1,'한눈에 보기')}<div class="kpis">${D.kpi.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v" data-n="${k[1]}">0<span class="u">${k[2]}</span></div><div class="d">${k[3]}</div></div>`).join('')}</div><div class="sum">${D.summary}</div>`);
S.push(`<section class="sl">${hd(2,'매출 — 4개월 연속 상승')}<div class="row"><div class="card"><h3>월별 매출 (만 원)</h3><div class="bars">${D.monthly.map((m,i)=>`<div class="bar${i==D.monthly.length-1?' hi':''}"><b>${m[1].toLocaleString()}</b><i data-h="${m[1]/mx(D.monthly)*100}"></i><span>${m[0]}</span></div>`).join('')}</div></div><div class="card"><h3>매출 구성</h3>${donut(D.mix)}</div></div>`);
S.push(`<section class="sl">${hd(3,'주차별 매출 · 지출 구조')}<div class="row"><div class="card"><h3>주차별 매출 (만 원)</h3><div class="bars" style="height:260px">${D.weekly.map(m=>`<div class="bar"><b>${m[1].toLocaleString()}</b><i data-h="${m[1]/mx(D.weekly)*100}"></i><span>${m[0]}</span></div>`).join('')}</div></div><div class="card"><h3>지출 (만 원)</h3>${D.cost.map(c=>`<div class="hb"><div class="t"><span>${c[0]}</span><b>${c[1].toLocaleString()}</b></div><div class="tr"><i data-w="${c[1]/mx(D.cost)*100}"></i></div></div>`).join('')}<p style="margin-top:14px;font-weight:700;color:var(--tc)">${D.costTotal}</p></div></div>`);
S.push(`<section class="sl">${hd(4,'인력 운영')}<div class="row"><ul class="pt">${D.staff.map(s=>`<li>${s}</li>`).join('')}</ul><div class="card"><h3>피크 대응 흐름</h3><div class="flow" style="flex-direction:column;align-items:stretch"><div>주말 13~17시 손님 집중<small>오후 비율 31%</small></div><em style="text-align:center">↓</em><div>오후 인원 2명 → 3명<small>대기 시간 단축</small></div><em style="text-align:center">↓</em><div>매출 · 리뷰 상승<small>평점 4.7</small></div></div></div></div>`);
S.push(`<section class="sl">${hd(5,'손님')}<div class="row"><div class="card"><h3>지표 (%)</h3>${D.guest.map(c=>`<div class="hb"><div class="t"><span>${c[0]}</span><b>${c[1]}%</b></div><div class="tr"><i data-w="${c[1]}"></i></div></div>`).join('')}</div><div class="card"><h3>메뉴 TOP 5 (잔)</h3>${D.menu.map((c,i)=>`<div class="hb"><div class="t"><span>${i+1}. ${c[0]}</span><b>${c[1].toLocaleString()}</b></div><div class="tr"><i data-w="${c[1]/mx(D.menu)*100}" style="background:${i?'var(--br)':'var(--tc)'}"></i></div></div>`).join('')}</div></div>`);
S.push(`<section class="sl">${hd(6,'이슈와 다음 달 계획')}<div class="row"><div><h3 style="font-size:18px;color:var(--mut);margin-bottom:6px">이슈</h3><ul class="pt">${D.issues.map(s=>`<li>${s}</li>`).join('')}</ul></div><div><h3 style="font-size:18px;color:var(--mut);margin-bottom:6px">11월 계획</h3><div class="flow" style="flex-direction:column;align-items:stretch">${D.next.map(n=>`<div style="text-align:left"><span style="color:var(--tc)">${n[0]}</span><small style="font-size:18px;color:var(--ink)">${n[1]}</small></div>`).join('')}</div></div></div>`);
function donut(a){let o=0,R=90,C=2*Math.PI*R;return `<div class="donut"><svg width="230" height="230" viewBox="0 0 230 230"><g transform="rotate(-90 115 115)">${a.map(x=>{const l=C*x[1]/100;const s=`<circle cx="115" cy="115" r="${R}" fill="none" stroke="${x[2]}" stroke-width="34" stroke-dasharray="0 ${C}" data-d="${l} ${C-l}" stroke-dashoffset="${-o}" style="transition:stroke-dasharray 1.1s ease"/>`;o+=l;return s}).join('')}</g><text x="115" y="124" text-anchor="middle" font-size="26" font-weight="800" fill="#4A2C21">${a[0][1]}%</text></svg><div class="lg">${a.map(x=>`<div><s style="background:${x[2]}"></s>${x[0]} ${x[1]}%</div>`).join('')}</div></div>`}
deck.innerHTML=S.map((s,i)=>s.endsWith('</section>')?s:s+ft(i+1)+'</section>').join('');
const L=[...deck.querySelectorAll('.sl')];let cur=0;
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720))}
function play(el){el.querySelectorAll('[data-h]').forEach(e=>{e.style.height='0';setTimeout(()=>e.style.height=e.dataset.h+'%',80)});
 el.querySelectorAll('[data-w]').forEach(e=>{e.style.width='0';setTimeout(()=>e.style.width=e.dataset.w+'%',80)});
 el.querySelectorAll('[data-d]').forEach(e=>{e.setAttribute('stroke-dasharray','0 999');setTimeout(()=>e.setAttribute('stroke-dasharray',e.dataset.d),80)});
 el.querySelectorAll('[data-n]').forEach(e=>{const t=parseFloat(e.dataset.n.replace(/,/g,'')),u=e.querySelector('.u').outerHTML;let k=0;const f=()=>{k+=1/30;const v=Math.round(t*Math.min(k,1));e.innerHTML=v.toLocaleString()+u;if(k<1)requestAnimationFrame(f)};f()})}
function go(n){cur=Math.max(0,Math.min(L.length-1,n));L.forEach((s,i)=>s.classList.toggle('on',i==cur));play(L[cur]);document.getElementById('pg').textContent=(cur+1)+' / '+L.length}
addEventListener('resize',fit);fit();go(0);
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key))go(cur+1);if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(cur-1)});
addEventListener('click',e=>go(e.clientX>innerWidth/2?cur+1:cur-1));
let lk=0;addEventListener('wheel',e=>{const t=Date.now();if(t<lk)return;lk=t+500;go(cur+(e.deltaY>0?1:-1))},{passive:true});
addEventListener('beforeprint',()=>L.forEach(play));
</script>
</body>
</html>
